name: ToolBox Public Runtime Contracts CI

on:
  push:
    branches:
      - main
    paths:
      - 'public-components/runtime-contracts/**'
      - '.github/workflows/runtime-contracts-ci.yml'
      - 'AGENTS.md'
      - 'GLOBAL_PUBLIC_PRIVATE_DEVELOPMENT_RULES.md'
      - 'AGENT_PROCEDURE_EXECUTION_RULES.md'
      - 'APPLICATION_SAFE_100_PROCESS.md'
      - 'APP_SAFE_R*.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'ASSET_SAFE_100_RULES.md'
      - 'ASSET_SAFE_100_PROCESS.md'
      - 'ASSET_SAFE_100_METHODS.md'
      - 'ASSET_ROUTE_PROOF_PROCESS.md'
      - 'ASSET_ROUTE_PROOF_METHODS.md'
      - 'PREBUILD_ASSET_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runtime-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-runtime-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Enforce Public boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "RMTampu/Tools"
          echo 'PUBLIC_PRIVATE_READ_ACCESS=0'
          echo 'PUBLIC_FINAL_BUILD=0'
          echo 'PUBLIC_FIREBASE_PRIVATE_ARTIFACT=0'

      - name: Checkout Public component source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.7'
          check-latest: false

      - name: Verify pinned runtimes
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          python --version
          python3 --version

      - name: R1-R8 prebuild assurance scope gate
        shell: bash
        run: python3 public-components/runtime-contracts/scripts/assurance_prebuild.py

      - name: Compile, unit/failure/concurrency/boundary/property test, simulator
        shell: bash
        run: bash public-components/runtime-contracts/scripts/run-tests.sh

      - name: Validate sanitized Private integration handoff
        shell: bash
        run: python3 public-components/runtime-contracts/scripts/integration_handoff_validate.py

      - name: R6 package mutation challenge
        shell: bash
        run: python3 public-components/runtime-contracts/scripts/package_mutation_test.py

      - name: R9 Public evidence completeness gate
        shell: bash
        run: python3 public-components/runtime-contracts/scripts/assurance_finalize.py

      - name: Validate Promotion Package
        shell: bash
        run: python3 public-components/runtime-contracts/scripts/package_validate.py

      - name: Bind sanitized integration handoff to Promotion Manifest
        shell: bash
        run: python3 public-components/runtime-contracts/scripts/bind_integration_handoff.py

      - name: Verify READY_PRIVATE manifest binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest=Path('public-components/runtime-contracts/build/promotion/promotion-manifest.json')
          handoff=Path('public-components/runtime-contracts/build/integration-handoff-evidence.json')
          data=json.loads(manifest.read_text())
          hand=json.loads(handoff.read_text())
          assert data['schemaVersion']==3
          assert data['status']=='READY_PRIVATE'
          assert data['sourceRepository']=='RMTampu/Tools'
          assert data['sourceCommitSha']==os.environ['GITHUB_SHA']
          assert data['workflowRunId']==os.environ['GITHUB_RUN_ID']
          assert data['privateContentIncluded'] is False
          assert data['assurance']['r1ToR9PublicAssurance']=='PASS'
          assert data['assurance']['r9EvidenceCompleteness']=='PASS'
          assert data['assurance']['finalApplicationSafe100Claimed'] is False
          assert data['testStatus']['packageMutation']=='PASS'
          assert data['testStatus']['packageValidation']=='PASS'
          assert data['sourceArchive']['promotionAllowed'] is True
          assert hand['status']=='PASS'
          assert hand['claim']=='PRIVATE_INTEGRATION_HANDOFF_CONTRACT'
          assert hand['sourceCommitSha']==os.environ['GITHUB_SHA']
          assert hand['workflowRunId']==os.environ['GITHUB_RUN_ID']
          assert hand['privateContentIncluded'] is False
          assert hand['privateTrustManifestOwnedByPublic'] is False
          assert hand['phaseArtifactSourceParityRequired'] is True
          assert hand['alternateArtifactsRequirePrivateTrustBinding'] is True
          assert hand['unboundRegressionArtifactFailsClosed'] is True
          assert hand['r6HandoffAssurance']=='PASS'
          assert hand['r9HandoffCompleteness']=='PASS'
          bound=data['integrationHandoff']
          assert bound['status']=='PASS'
          assert bound['claim']=='PRIVATE_INTEGRATION_HANDOFF_CONTRACT'
          assert bound['phaseArtifactSourceParityRequired'] is True
          assert bound['alternateArtifactsRequirePrivateTrustBinding'] is True
          assert bound['unboundRegressionArtifactFailsClosed'] is True
          assert bound['r6HandoffAssurance']=='PASS'
          assert bound['r9HandoffCompleteness']=='PASS'
          assert bound['privateContentIncluded'] is False
          print('PRIVATE_INTEGRATION_HANDOFF_BINDING = PASS')
          print('R6_R9_HANDOFF_BINDING = PASS')
          print('READY_PRIVATE_BINDING = PASS')
          PY

      - name: Upload Promotion Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-runtime-contracts-ready-private
          path: |
            public-components/runtime-contracts/build/package/toolbox-runtime-contracts-0.1.0.jar
            public-components/runtime-contracts/build/package/toolbox-runtime-contracts-0.1.0-sources.zip
            public-components/runtime-contracts/build/promotion/promotion-manifest.json
            public-components/runtime-contracts/build/test-summary.txt
            public-components/runtime-contracts/build/test-output.txt
            public-components/runtime-contracts/build/boundary-output.txt
            public-components/runtime-contracts/build/property-output.txt
            public-components/runtime-contracts/build/simulator-output.txt
            public-components/runtime-contracts/build/package-mutation-output.txt
            public-components/runtime-contracts/build/assurance/r1-r9-summary.txt
            public-components/runtime-contracts/build/assurance/r1-r9-evidence.json
            public-components/runtime-contracts/build/integration-handoff-evidence.json
            public-components/runtime-contracts/PRIVATE_INTEGRATION_REQUIREMENTS.json
            public-components/runtime-contracts/SANITIZED_PRIVATE_FAILURE_2026-09-03.md
            public-components/runtime-contracts/R6_PRIVATE_HANDOFF_ASSURANCE_ADDENDUM.md
          if-no-files-found: error
          retention-days: 7

      - name: Auto Cleanup Public workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf public-components/runtime-contracts/build
          rm -rf public-components/runtime-contracts/.assurance-state
          rm -rf "$RUNNER_TEMP"/toolbox-public-* 2>/dev/null || true
          echo 'PUBLIC_JOB_AUTO_CLEANUP = DONE'
