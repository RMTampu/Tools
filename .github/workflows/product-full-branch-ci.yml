name: ToolBox Produk Penuh Public CI

on:
  workflow_dispatch:
  push:
    branches: [produk-penuh-work, baseline-v12-maximal-work]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'RANCANGAN_PRODUK_PENUH.md'
      - '.github/workflows/product-full-branch-ci.yml'
      - 'AGENTS.md'
      - 'TASK.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'APP_SAFE_R*.md'
      - 'ASSET_SAFE_100_*'
      - 'ASSET_ROUTE_PROOF_*'
      - 'PREBUILD_ASSET_GATE.md'
      - 'APPLICATION_SAFE_100_PROCESS.md'
      - 'TEST_ROUTING_POLICY.md'

permissions:
  contents: read

concurrency:
  group: toolbox-produk-penuh-public-ci
  cancel-in-progress: true

jobs:
  full-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 11 API30 inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-30' 'build-tools;34.0.0' 'system-images;android-30;google_apis;x86_64'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Audit 135 bagian rancangan dan R1-R8
        run: python3 app/scripts/product_full_assurance_prebuild.py

      - name: Audit ASSET_SAFE sebelum build
        run: python3 app/scripts/product_full_asset_validate.py

      - name: Unit dan failure tests
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: R9 mutation challenge
        run: python3 app/scripts/product_full_mutation_test.py

      - name: Pulihkan evidence unit test bersih
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: Buktikan behavior 135/135 dari JUnit
        run: python3 app/scripts/product_behavior_evidence.py

      - name: Build debug dan release unsigned
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verifikasi package Android 11
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s "$DEBUG"
          B="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.toolbox.tools'" <<< "$B"
          grep -F "versionCode='13'" <<< "$B"
          grep -F "versionName='13.0-produk-penuh-maksimal'" <<< "$B"
          grep -F "sdkVersion:'30'" <<< "$B"
          grep -F "targetSdkVersion:'30'" <<< "$B"
          R="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump resources "$APK")"
          grep -F 'mipmap/ic_launcher' <<< "$R"
          grep -F 'mipmap/ic_launcher_round' <<< "$R"
          # AAPT2 may flatten/rename compiled resource entries. The
          # resource table above proves the manifest-bound launcher IDs,
          # while this proves at least one physical raster payload is in APK.
          unzip -l "$APK" | grep -E 'res/.*\.(webp|png)          echo 'PUBLIC_SIGNING_USED = NO'
          echo 'FIREBASE_USED = NO'

      - name: Uji workbench produk penuh pada emulator API30
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/product-full-avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | avdmanager create avd --force             --name product-full-api30             --package 'system-images;android-30;google_apis;x86_64'             --path "$ANDROID_AVD_HOME/product-full-api30.avd"             --device 'pixel_2'
          "$ANDROID_SDK_ROOT/emulator/emulator"             -avd product-full-api30             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device
          booted=0
          for _ in $(seq 1 90); do
            [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && { booted=1; break; }
            kill -0 "$PID" 2>/dev/null || {
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2 || true
              exit 1
            }
            sleep 2
          done
          test "$booted" = 1

          API_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ABI="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$API_LEVEL" = 30
          test "$ABI" = x86_64

          gradle --no-daemon :app:connectedDebugAndroidTest --rerun-tasks
          test -d app/build/outputs/androidTest-results/connected
          grep -R 'launcherTbResourceIsBoundAndDecodable' app/build/outputs/androidTest-results/connected
          grep -R 'externalAssetRendererUsesRealAndroidImageConsumer' app/build/outputs/androidTest-results/connected
          grep -R 'memoryPressurePolicyDegradesAndRecoversOnDevice' app/build/outputs/androidTest-results/connected
          grep -R 'safeRecoveryUiPersistsAcrossActivityRecreation' app/build/outputs/androidTest-results/connected
          grep -R 'patchJournalInterruptedStateRollsBackOnDevice' app/build/outputs/androidTest-results/connected
          ANDROID_INSTRUMENTATION_PASS=1
          LAUNCHER_TB_RUNTIME_PASS=1
          ASSET_RUNTIME_RENDERER_PASS=1
          MEMORY_PRESSURE_POLICY_PASS=1
          SAFE_RECOVERY_RUNTIME_PASS=1
          PATCH_JOURNAL_RUNTIME_PASS=1

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          START="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
          grep -F 'Status: ok' <<< "$START"
          sleep 2

          dump_ui(){
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null
          }

          assert_text(){
            local target="$1"
            dump_ui
            python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('text',''):
                  print('UI_TEXT_PASS='+target)
                  raise SystemExit
          raise SystemExit('UI_TEXT_MISSING='+target)
          PY
          }

          assert_desc(){
            local target="$1"
            dump_ui
            python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('content-desc',''):
                  print('UI_DESC_PASS='+target)
                  raise SystemExit
          raise SystemExit('UI_DESC_MISSING='+target)
          PY
          }

          tap_desc(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('content-desc',''):
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_DESC_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 0.5
          }

          long_press_desc(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('content-desc',''):
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_DESC_NOT_FOUND='+target)
          PY
            )
            adb shell input swipe "$X" "$Y" "$X" "$Y" 900
            sleep 1
          }

          tap_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          tap_right_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          matches=[]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      matches.append(((l+r)//2,(t+b)//2))
          if not matches:
              raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          x,y=max(matches,key=lambda p:p[0])
          print(x,y)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          tap_clickable_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          matches=[]
          for n in root.iter('node'):
              if n.attrib.get('text')==target and n.attrib.get('clickable')=='true':
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      matches.append(((l+r)//2,(t+b)//2))
          if not matches:
              raise SystemExit('CLICKABLE_UI_TEXT_NOT_FOUND='+target)
          x,y=max(matches,key=lambda p:p[0])
          print(x,y)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          # Destructive process-death matrix: kill proses di marker transaksi nyata,
          # restart host, lalu buktikan journal bersih dan current revision tidak mixed.
          for PHASE in PREPARED SNAPSHOT_READY MUTATING VERIFYING HEALTH_CHECK COMMITTING; do
            adb shell am force-stop com.toolbox.tools
            adb shell am start -n com.toolbox.tools/.debug.CrashHarnessActivity \
              --es mode patch --es phase "$PHASE" >/dev/null 2>&1 || true
            sleep 1
            RESTART_PATCH="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
            grep -F 'Status: ok' <<< "$RESTART_PATCH"
            sleep 1

            STATE="$(adb shell run-as com.toolbox.tools cat files/projects/project.default/secure-runtime.properties 2>/dev/null || true)"
            ! grep -F 'patch.journal.' <<< "$STATE"

            CURRENT="$(adb shell run-as com.toolbox.tools cat files/projects/project.default/current.ref | tr -d '\r\n')"
            [[ "$CURRENT" =~ ^[0-9]+$ ]]
            CURRENT_DUMP="$(adb shell run-as com.toolbox.tools sh -c "grep -R 'interrupted\\.' files/projects/project.default/revisions/$CURRENT 2>/dev/null || true")"
            test -z "$CURRENT_DUMP"
          done
          PATCH_DESTRUCTIVE_MATRIX_PASS=1

          for FREEZE_PHASE in COMMITTING RECOVERY_RUNNING; do
            adb shell am force-stop com.toolbox.tools
            adb shell am start -n com.toolbox.tools/.debug.CrashHarnessActivity \
              --es mode freeze --es phase "$FREEZE_PHASE" >/dev/null 2>&1 || true
            sleep 1
            RESTART_FREEZE="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
            grep -F 'Status: ok' <<< "$RESTART_FREEZE"
            sleep 1
            FREEZE_STATE="$(adb shell run-as com.toolbox.tools cat files/projects/project.default/secure-runtime.properties 2>/dev/null || true)"
            grep -F 'freeze.state=FROZEN' <<< "$FREEZE_STATE"
            ! grep -F 'freeze.journal.operation' <<< "$FREEZE_STATE"

            # Kembalikan ke NORMAL melalui UI agar case berikutnya independen.
            tap_text 'TB'
            tap_desc 'Pintasan Tool'
            tap_text 'Freeze / Mode Simpan'
            tap_text 'Thaw / Kembali Normal'
          done
          FREEZE_DESTRUCTIVE_MATRIX_PASS=1

          assert_text 'ToolBox'
          assert_text 'Beranda ToolBox • ruang kerja aplikasi'
          assert_text 'PROYEK AKTIF'
          assert_text 'AKTIVITAS TOOLBOX'
          assert_text 'KESEHATAN SISTEM'
          assert_text 'Panel Utama'
          assert_text 'Editor'

          # Cold-start harus selalu masuk Beranda ToolBox, bukan langsung Editor.
          dump_ui
          ! grep -F 'text="Fungsi Editor • 5-in-1"' "$RUNNER_TEMP/window.xml"
          ! grep -F 'text="UI"' "$RUNNER_TEMP/window.xml"
          ! grep -F 'text="Simpan"' "$RUNNER_TEMP/window.xml"

          # Handle Edge memakai touch target besar dan satu ketukan harus langsung merespons.
          assert_desc 'Handle panel kanan • terbuka'
          tap_desc 'Handle panel kanan • terbuka'
          assert_desc 'Handle panel kanan • tertutup'
          tap_desc 'Handle panel kanan • tertutup'
          assert_desc 'Handle panel kanan • terbuka'

          # Long-press memindahkan Edge kanan/kiri di portrait.
          long_press_desc 'Handle panel kanan • terbuka'
          assert_desc 'Handle panel kiri • terbuka'
          long_press_desc 'Handle panel kiri • terbuka'
          assert_desc 'Handle panel kanan • terbuka'

          # Landscape memakai Edge bawah/atas, bukan tetap di sisi kanan.
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 3
          assert_text 'Beranda ToolBox • ruang kerja aplikasi'
          assert_desc 'Handle panel bawah • terbuka'
          long_press_desc 'Handle panel bawah • terbuka'
          assert_desc 'Handle panel atas • terbuka'
          adb shell settings put system user_rotation 0
          sleep 3
          assert_text 'Beranda ToolBox • ruang kerja aplikasi'
          assert_desc 'Handle panel kanan • terbuka'

          # Bubble menampilkan pintasan langsung di sekitar bubble, bukan window.
          tap_text 'TB'
          assert_text 'Edit AKTIF'
          assert_text 'Tool'
          assert_text 'Pengaturan'
          assert_text 'Floating Window'
          dump_ui
          ! grep -F 'text="Akses Cepat"' "$RUNNER_TEMP/window.xml"
          tap_desc 'Pintasan Floating Window'
          assert_text 'Floating Editor • UI'
          assert_text 'Pin'
          assert_text 'Ubah Ukuran'
          assert_text 'Tutup'
          tap_text 'Tutup'

          # Entry Editor menampilkan empat pilihan edit sebelum workspace.
          tap_text 'Editor'
          assert_text 'Pilih Jalur Editor'
          assert_text 'Proyek Tersimpan'
          assert_text 'Aplikasi Terinstal'
          assert_text 'Edit ToolBox'
          assert_text 'Buat / Edit Komponen'

          tap_text 'Proyek Tersimpan'
          assert_text 'Bangun aplikasi secara visual'
          assert_text 'Fungsi Editor • 5-in-1'
          assert_text 'Representasi • Visual'
          assert_text 'Mode Kerja • Edit'

          # Lima fungsi tetap satu Editor, dipilih dari panel, bukan menu bawah.
          tap_text 'Fungsi Editor • 5-in-1'
          assert_text 'Fungsi 5-in-1'
          assert_text 'UI'
          assert_text 'Logika'
          assert_text 'Data'
          assert_text 'Pengikatan'
          assert_text 'Aset'

          tap_text 'Logika'
          assert_text 'Editor Logika Visual'
          tap_text 'Fungsi Editor • 5-in-1'
          tap_text 'UI'
          assert_text 'Bangun aplikasi secara visual'

          # Representasi berada di panel dan benar-benar mengganti workspace.
          tap_text 'Representasi • Visual'
          tap_text 'Properti'
          assert_text 'Properti Terstruktur'
          assert_text 'Terapkan Properti'
          tap_text 'Representasi • Properti'
          tap_text 'Kode'
          assert_text 'Representasi Deklaratif'
          assert_text 'Terapkan Kode Deklaratif'
          tap_text 'Representasi • Kode'
          tap_text 'Visual'
          assert_text 'Bangun aplikasi secara visual'

          # Mode berada di panel. Edge tetap dapat dibuka/tutup pada Pratinjau.
          tap_text 'Mode Kerja • Edit'
          tap_text 'Pratinjau'
          assert_text 'Mode Kerja • Pratinjau'
          assert_desc 'Handle panel kanan • terbuka'
          tap_desc 'Handle panel kanan • terbuka'
          assert_desc 'Handle panel kanan • tertutup'
          tap_desc 'Handle panel kanan • tertutup'
          assert_text 'Mode Kerja • Pratinjau'

          tap_text 'Mode Kerja • Pratinjau'
          tap_text 'Uji'
          assert_text 'Mode Kerja • Uji'
          assert_desc 'Handle panel kanan • terbuka'

          tap_text 'Mode Kerja • Uji'
          tap_text 'Langsung'
          assert_text 'Mode Kerja • Langsung'
          assert_desc 'Handle panel kanan • terbuka'

          tap_text 'Mode Kerja • Langsung'
          tap_text 'Edit'
          assert_text 'Mode Kerja • Edit'

          # Menu kontekstual memiliki aksi nyata, bukan placeholder.
          tap_text 'Konteks • UI'
          assert_text 'Tambah ke Layar'
          tap_text 'Komponen'
          assert_text 'Tombol Aksi'
          tap_text 'Tombol Aksi'
          assert_text 'Tombol Aksi'

          # Lima fungsi Editor wajib mempunyai aksi kontekstual yang benar-benar berubah.
          tap_text '‹ Kembali'
          tap_text 'Fungsi Editor • 5-in-1'
          tap_text 'Logika'
          assert_text 'Editor Logika Visual'
          tap_text 'Konteks • Logika'
          tap_text 'Aksi'
          assert_text 'Tampilkan Pesan'
          tap_text 'Tampilkan Pesan'
          tap_text 'Aksi'
          assert_text '✓ Tampilkan Pesan'
          tap_text 'Tutup'
          tap_text '‹ Kembali'

          tap_text 'Fungsi Editor • 5-in-1'
          tap_text 'Data'
          assert_text 'Editor Data'
          dump_ui
          ! grep -F 'text="+ Tambah Field"' "$RUNNER_TEMP/window.xml"
          tap_text 'Konteks • Data'
          tap_clickable_text 'Kelola Data Contoh'
          assert_text 'Aktifkan'
          tap_text 'Aktifkan'
          tap_clickable_text 'Kelola Data Contoh'
          assert_text '✓ Aktifkan'
          tap_text 'Tutup'
          tap_text '‹ Kembali'

          tap_text 'Fungsi Editor • 5-in-1'
          tap_text 'Pengikatan'
          assert_text 'Pusat Pengikatan'
          dump_ui
          ! grep -F 'text="Hubungkan Semua Otomatis"' "$RUNNER_TEMP/window.xml"
          tap_text 'Konteks • Pengikatan'
          tap_text 'Hubungkan Otomatis'
          assert_text 'Lepaskan'
          tap_text 'Lepaskan'
          tap_text 'Status'
          assert_text 'Mode: TIDAK TERHUBUNG'
          tap_text 'Tutup'
          tap_text '‹ Kembali'

          tap_text 'Fungsi Editor • 5-in-1'
          tap_text 'Aset'
          assert_text 'Pusat Aset & Library'
          tap_text 'Konteks • Aset'
          tap_clickable_text 'Impor Aset'
          assert_text 'Pilih File dari Perangkat'
          assert_text 'Token Bawaan'
          tap_text 'Token Bawaan'
          tap_clickable_text 'Impor Aset'
          assert_text '✓ Token Bawaan'
          tap_text 'Tutup'
          tap_text '‹ Kembali'

          # Tool dari pintasan Bubble tetap membuka jalur alat yang berbeda dari Floating Window.
          tap_text 'TB'
          tap_desc 'Pintasan Tool'
          assert_text 'Alat ToolBox'
          tap_text 'Bangun & SIAP'
          assert_text 'Kelengkapan Produk: LULUS'
          assert_text 'Rancangan Behavior: 135/135'
          assert_text 'Signing: hanya jalur Private'
          assert_text 'Firebase: hanya setelah izin pengguna'
          tap_text 'Tutup'

          # Health/Safe Mode UI benar-benar tersedia.
          tap_text 'TB'
          tap_desc 'Pintasan Tool'
          tap_text 'Perbaikan & Kesehatan'
          assert_text 'Kesehatan & Perbaikan'
          assert_text 'Jalankan Health Check'
          assert_text 'Masuk Mode Aman'
          tap_text 'Jalankan Health Check'
          assert_text 'Hasil Health Check'
          assert_text 'Kernel: READY'
          tap_text 'Tutup'

          # Evolution UI membuka pipeline app.patch tanpa rebuild.
          tap_text 'TB'
          tap_desc 'Pintasan Tool'
          tap_text 'Paket Evolusi Tanpa Rebuild'
          assert_text 'Evolusi Tanpa Rebuild'
          assert_text 'Pilih Paket app.patch'
          assert_text 'Terapkan Paket Terverifikasi'
          assert_text 'Rollback ke Revisi Dasar'
          tap_text 'Tutup'

          # Save Mode memiliki state aktif yang terlihat dan kembali ke NORMAL.
          tap_text 'TB'
          tap_desc 'Pintasan Tool'
          tap_text 'Freeze / Mode Simpan'
          assert_desc 'Pilihan aktif • Mode Normal'
          tap_text 'Mode Simpan • Titik Pemeriksaan'
          tap_text 'TB'
          tap_desc 'Pintasan Tool'
          tap_text 'Freeze / Mode Simpan'
          assert_desc 'Pilihan aktif • Mode Simpan • Titik Pemeriksaan'
          tap_text 'Thaw / Kembali Normal'
          tap_text 'TB'
          tap_desc 'Pintasan Tool'
          tap_text 'Freeze / Mode Simpan'
          assert_desc 'Pilihan aktif • Mode Normal'
          tap_text 'Tutup'

          adb exec-out screencap -p > app/build/assurance/product-full-api30.png

          adb shell dumpsys gfxinfo com.toolbox.tools             > app/build/assurance/product-full-gfxinfo.txt
          test -s app/build/assurance/product-full-gfxinfo.txt
          GFXINFO_RUNTIME_PASS=1

          PSS_KB="$(adb shell dumpsys meminfo com.toolbox.tools             | awk '/TOTAL PSS:/ {print $3; exit} /^ *TOTAL / {print $2; exit}'             | tr -d '\r')"
          [[ "$PSS_KB" =~ ^[0-9]+$ ]]
          test "$PSS_KB" -lt 196608
          PSS_BUDGET_RUNTIME_PASS=1

