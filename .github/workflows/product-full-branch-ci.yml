      - name: Uji workbench produk penuh pada emulator API30
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/product-full-avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | avdmanager create avd --force             --name product-full-api30             --package 'system-images;android-30;google_apis;x86_64'             --path "$ANDROID_AVD_HOME/product-full-api30.avd"             --device 'pixel_2'
          "$ANDROID_SDK_ROOT/emulator/emulator"             -avd product-full-api30             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device
          booted=0
          for _ in $(seq 1 90); do
            [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && { booted=1; break; }
            kill -0 "$PID" 2>/dev/null || {
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2 || true
              exit 1
            }
            sleep 2
          done
          test "$booted" = 1

          API_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ABI="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$API_LEVEL" = 30
          test "$ABI" = x86_64

          gradle --no-daemon :app:connectedDebugAndroidTest --rerun-tasks
          test -d app/build/outputs/androidTest-results/connected
          grep -R 'launcherTbResourceIsBoundAndDecodable' app/build/outputs/androidTest-results/connected
          grep -R 'externalAssetRendererUsesRealAndroidImageConsumer' app/build/outputs/androidTest-results/connected
          grep -R 'memoryPressurePolicyDegradesAndRecoversOnDevice' app/build/outputs/androidTest-results/connected
          grep -R 'safeRecoveryUiPersistsAcrossActivityRecreation' app/build/outputs/androidTest-results/connected
          grep -R 'patchJournalInterruptedStateRollsBackOnDevice' app/build/outputs/androidTest-results/connected
          ANDROID_INSTRUMENTATION_PASS=1
          LAUNCHER_TB_RUNTIME_PASS=1
          ASSET_RUNTIME_RENDERER_PASS=1
          MEMORY_PRESSURE_POLICY_PASS=1
          SAFE_RECOVERY_RUNTIME_PASS=1
          PATCH_JOURNAL_RUNTIME_PASS=1

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          START="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
          grep -F 'Status: ok' <<< "$START"
          sleep 2

          dump_ui(){
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null
          }

          assert_text(){
            local target="$1"
            dump_ui
            python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('text',''):
                  print('UI_TEXT_PASS='+target)
                  raise SystemExit
          raise SystemExit('UI_TEXT_MISSING='+target)
          PY
          }

          assert_desc(){
            local target="$1"
            dump_ui
            python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('content-desc',''):
                  print('UI_DESC_PASS='+target)
                  raise SystemExit
          raise SystemExit('UI_DESC_MISSING='+target)
          PY
          }

          tap_desc(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('content-desc',''):
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_DESC_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 0.5
          }

          long_press_desc(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if target in n.attrib.get('content-desc',''):
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_DESC_NOT_FOUND='+target)
          PY
            )
            adb shell input swipe "$X" "$Y" "$X" "$Y" 900
            sleep 1
          }

          tap_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          tap_right_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          matches=[]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      matches.append(((l+r)//2,(t+b)//2))
          if not matches:
              raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          x,y=max(matches,key=lambda p:p[0])
          print(x,y)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          tap_clickable_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/window.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          matches=[]
          for n in root.iter('node'):
              if n.attrib.get('text')==target and n.attrib.get('clickable')=='true':
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      l,t,r,b=map(int,m.groups())
                      matches.append(((l+r)//2,(t+b)//2))
          if not matches:
              raise SystemExit('CLICKABLE_UI_TEXT_NOT_FOUND='+target)
          x,y=max(matches,key=lambda p:p[0])
          print(x,y)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          # Destructive process-death matrix: kill proses di marker transaksi nyata,
          # restart host, lalu buktikan journal bersih dan current revision tidak mixed.
          for PHASE in PREPARED SNAPSHOT_READY MUTATING VERIFYING HEALTH_CHECK COMMITTING; do
            adb shell am force-stop com.toolbox.tools
            adb shell am start -n com.toolbox.tools/.debug.CrashHarnessActivity \
              --es mode patch --es phase "$PHASE" >/dev/null 2>&1 || true
            sleep 1
            RESTART_PATCH="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
            grep -F 'Status: ok' <<< "$RESTART_PATCH"
            sleep 1

            STATE="$(adb shell run-as com.toolbox.tools cat files/projects/project.default/secure-runtime.properties 2>/dev/null || true)"
            ! grep -F 'patch.journal.' <<< "$STATE"

            CURRENT="$(adb shell run-as com.toolbox.tools cat files/projects/project.default/current.ref | tr -d '\r\n')"
            [[ "$CURRENT" =~ ^[0-9]+$ ]]
            CURRENT_DUMP="$(adb shell run-as com.toolbox.tools sh -c "grep -R 'interrupted\\.' files/projects/project.default/revisions/$CURRENT 2>/dev/null || true")"
            test -z "$CURRENT_DUMP"
          done
          PATCH_DESTRUCTIVE_MATRIX_PASS=1

          for FREEZE_PHASE in COMMITTING RECOVERY_RUNNING; do
            adb shell am force-stop com.toolbox.tools
            adb shell am start -n com.toolbox.tools/.debug.CrashHarnessActivity \
              --es mode freeze --es phase "$FREEZE_PHASE" >/dev/null 2>&1 || true
            sleep 1
            RESTART_FREEZE="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
            grep -F 'Status: ok' <<< "$RESTART_FREEZE"
            sleep 1
            FREEZE_STATE="$(adb shell run-as com.toolbox.tools cat files/projects/project.default/secure-runtime.properties 2>/dev/null || true)"
            grep -F 'freeze.state=FROZEN' <<< "$FREEZE_STATE"
            ! grep -F 'freeze.journal.operation' <<< "$FREEZE_STATE"

            # Kembalikan ke NORMAL melalui UI agar case berikutnya independen.
            tap_text 'TB'
            tap_desc 'Pintasan Tool'
            tap_text 'Freeze / Mode Simpan'
            tap_text 'Thaw / Kembali Normal'
          done
          FREEZE_DESTRUCTIVE_MATRIX_PASS=1

          assert_text 'ToolBox'
          assert_text 'Beranda ToolBox • ruang kerja aplikasi'
          assert_text 'PROYEK AKTIF'
          assert_text 'AKTIVITAS TOOLBOX'
          assert_text 'KESEHATAN SISTEM'
          assert_text 'Panel Utama'
          assert_text 'Editor'

          # Cold-start harus selalu masuk Beranda ToolBox, bukan langsung Editor.
          dump_ui
          ! grep -F 'text="Fungsi Editor • 5-in-1"' "$RUNNER_TEMP/window.xml"
          ! grep -F 'text="UI"' "$RUNNER_TEMP/window.xml"
          ! grep -F 'text="Simpan"' "$RUNNER_TEMP/window.xml"

