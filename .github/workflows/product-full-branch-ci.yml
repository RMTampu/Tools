        run: python3 app/scripts/product_zero_gap_finalize.py

      - name: Upload paket siap signing private
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: toolbox-produk-penuh-v13-maximal-public-ready-private-signing
