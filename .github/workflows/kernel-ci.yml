name: ToolBox Kernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Verify exact Java runtime
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$RUNNER_TEMP/java-version.txt"
          grep -F 'openjdk version "17.0.20.1"' "$RUNNER_TEMP/java-version.txt"
          grep -F 'Temurin-17.0.20.1+1' "$RUNNER_TEMP/java-version.txt"
          test -s "$JAVA_HOME/release"
          grep -F 'JAVA_VERSION="17.0.20.1"' "$JAVA_HOME/release"
          grep -F 'IMPLEMENTOR="Eclipse Adoptium"' "$JAVA_HOME/release"

      - name: Setup Gradle 8.7 without shared cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify Gradle distribution identity
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          GRADLE_ZIP="$RUNNER_TEMP/.gradle-actions/gradle-installations/downloads/gradle-8.7-bin.zip"
          test -f "$GRADLE_ZIP"
          echo '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  '"$GRADLE_ZIP" | sha256sum -c -

      - name: Verify accepted dependency trust state
        shell: bash
        run: python3 verification/scripts/dependency_trust_gate.py

      - name: Run kernel and engine-host tests with strict dependency verification
        shell: bash
        run: gradle --no-daemon --dependency-verification strict :toolbox-kernel:test :toolbox-engine-host:test
