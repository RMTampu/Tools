name: ToolBox Kernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.7'

      - name: Bootstrap and verify kernel API
        run: |
          gradle --no-daemon --warning-mode=all :toolbox-kernel:apiDump
          gradle --no-daemon --warning-mode=all :toolbox-kernel:clean :toolbox-kernel:check

      - name: Export ABI baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolbox-kernel-api-baseline
          path: toolbox-kernel/api/toolbox-kernel.api
          if-no-files-found: error
