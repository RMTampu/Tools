name: ToolBox Kernel CI

on:
  push:
    branches: [main, kernel-foundation-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup exact Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Setup exact Android command line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install exact Android toolchain inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-30' 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'
          test -s "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
          test -s "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/d8"

      - name: Fail-closed Android 11 ARM64 toolchain gate
        run: python3 verification/scripts/toolchain_gate.py --mode build

      - name: Runtime CI route regression guard
        run: python3 verification/scripts/runtime_ci_guard.py

      - name: Verify kernel and locked ABI
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:clean :toolbox-kernel:check

      - name: Verify Android API 30 DEX compatibility
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:jar
          KERNEL_JAR="$(find toolbox-kernel/build/libs -maxdepth 1 -type f -name 'toolbox-kernel-*.jar' | sort | head -n 1)"
          test -n "$KERNEL_JAR"
          if jar tf "$KERNEL_JAR" | grep -Eq '\.so$'; then
            echo 'Pure kernel artifact unexpectedly contains native libraries'
            exit 1
          fi
          KOTLIN_STDLIB="$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/1.9.24" -type f -name '*.jar' | sort | head -n 1)"
          test -n "$KOTLIN_STDLIB"
          DEX_OUT="$RUNNER_TEMP/toolbox-kernel-dex"
          mkdir -p "$DEX_OUT"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/d8" \
            --release \
            --min-api 30 \
            --lib "$ANDROID_SDK_ROOT/platforms/android-30/android.jar" \
            --classpath "$KOTLIN_STDLIB" \
            --output "$DEX_OUT" \
            "$KERNEL_JAR"
          test -s "$DEX_OUT/classes.dex"
