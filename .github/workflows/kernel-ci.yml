name: ToolBox Kernel CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  kernel-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout caller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Record source provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_REPOSITORY=$GITHUB_REPOSITORY"
          echo "SOURCE_COMMIT_SHA=$GITHUB_SHA"
          echo "SOURCE_REF=$GITHUB_REF"
          echo "CI_REPOSITORY=RMTampu/Tools"

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup Gradle 8.7 without shared cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify dependency trust state
        shell: bash
        run: python3 verification/scripts/dependency_trust_gate.py

      - name: Run kernel tests
        shell: bash
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:test
