name: ToolBox Kernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.7'

      - name: Verify kernel and locked ABI
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:clean :toolbox-kernel:check

      - name: Install Android API 30 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-30/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"

      - name: Verify Android API 30 DEX compatibility
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:jar
          KERNEL_JAR="$(find toolbox-kernel/build/libs -maxdepth 1 -type f -name 'toolbox-kernel-*.jar' | sort | head -n 1)"
          test -n "$KERNEL_JAR"
          if jar tf "$KERNEL_JAR" | grep -Eq '\.so$'; then
            echo "Pure kernel artifact unexpectedly contains native libraries"
            exit 1
          fi
          KOTLIN_STDLIB="$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/1.9.24" -type f -name '*.jar' | sort | head -n 1)"
          test -n "$KOTLIN_STDLIB"
          DEX_OUT="$RUNNER_TEMP/toolbox-kernel-dex"
          mkdir -p "$DEX_OUT"
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --release \
            --min-api 30 \
            --lib "$ANDROID_HOME/platforms/android-30/android.jar" \
            --classpath "$KOTLIN_STDLIB" \
            --output "$DEX_OUT" \
            "$KERNEL_JAR"
          test -s "$DEX_OUT/classes.dex"
