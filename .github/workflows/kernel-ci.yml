name: ToolBox Public Kernel Research CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Enforce Public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "RMTampu/Tools" || {
            echo '::error::Workflow ini hanya boleh mengeksekusi source Public RMTampu/Tools.'
            exit 1
          }

      - name: Checkout Public research source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Record Public provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_REPOSITORY=$GITHUB_REPOSITORY"
          echo "SOURCE_COMMIT_SHA=$GITHUB_SHA"
          echo "SOURCE_REF=$GITHUB_REF"
          echo "EXECUTION_REPOSITORY=$GITHUB_REPOSITORY"
          echo 'SCOPE=PUBLIC_RESEARCH_TEST_STAGING'

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup Gradle 8.7 without shared cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify dependency trust state
        shell: bash
        run: python3 verification/scripts/dependency_trust_gate.py

      - name: Run Public kernel tests
        shell: bash
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:test

      - name: Auto Cleanup Public workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf toolbox-kernel/build .gradle
          rm -rf "$RUNNER_TEMP"/toolbox-public-* 2>/dev/null || true
          echo 'PUBLIC_WORKSPACE_AUTO_CLEANUP = DONE'
