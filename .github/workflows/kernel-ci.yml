name: ToolBox Kernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.7'

      - name: Generate kernel ABI baseline
        run: gradle --no-daemon --warning-mode=all :toolbox-kernel:apiDump

      - name: Commit ABI baseline once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git cat-file -e HEAD:toolbox-kernel/api/toolbox-kernel.api 2>/dev/null; then
            echo "ABI baseline is already committed"
            exit 0
          fi
          git add toolbox-kernel/api/toolbox-kernel.api
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Lock kernel ABI baseline'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

      - name: Verify kernel
        run: gradle --no-daemon --warning-mode=all :toolbox-kernel:clean :toolbox-kernel:check
