name: Kernel ABI Baseline Candidate

on:
  push:
    branches: [kernel-foundation-hardening]
    paths:
      - '.github/workflows/kernel-abi-baseline-candidate.yml'
      - 'toolbox-kernel/src/main/**'
      - 'toolbox-kernel/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/verification-metadata.xml'
      - 'toolbox-kernel/gradle.lockfile'

permissions:
  contents: write

jobs:
  abi-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          check-latest: false

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify tests independently of ABI baseline
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:test

      - name: Generate ABI baseline candidate
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:apiDump

      - name: Require generated baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s toolbox-kernel/api/toolbox-kernel.api
          sha256sum toolbox-kernel/api/toolbox-kernel.api > "$RUNNER_TEMP/toolbox-kernel.api.sha256"

      - name: Upload ABI baseline candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: kernel-abi-baseline-candidate
          path: |
            toolbox-kernel/api/toolbox-kernel.api
            ${{ runner.temp }}/toolbox-kernel.api.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Commit reviewed ABI baseline only
        shell: bash
        run: |
          set -euo pipefail
          git add toolbox-kernel/api/toolbox-kernel.api
          mapfile -t staged < <(git diff --cached --name-only)
          if [[ "${#staged[@]}" -eq 0 ]]; then
            echo 'ABI baseline already current.'
            exit 0
          fi
          if [[ "${#staged[@]}" -ne 1 || "${staged[0]}" != 'toolbox-kernel/api/toolbox-kernel.api' ]]; then
            printf 'Unexpected staged ABI candidate paths:\n%s\n' "${staged[*]}" >&2
            exit 1
          fi
          git config user.name 'toolbox-abi-baseline[bot]'
          git config user.email 'toolbox-abi-baseline[bot]@users.noreply.github.com'
          git commit -m 'Update kernel ABI baseline for runtime resource limits'
          git push origin HEAD:kernel-foundation-hardening
