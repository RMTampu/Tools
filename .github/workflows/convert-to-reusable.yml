name: One-time Convert Tools to Reusable CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-to-reusable.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public Tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Convert product workflows to caller-source reusable workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')

          def replace_trigger(name: str, block: str):
              p = root / name
              text = p.read_text()
              new, count = re.subn(r'^on:\n.*?^permissions:', block + '\n\npermissions:', text, count=1, flags=re.M | re.S)
              if count != 1:
                  raise SystemExit(f'could not replace trigger block in {name}')
              p.write_text(new)

          simple = 'on:\n  workflow_call:'
          replace_trigger('kernel-ci.yml', simple)
          replace_trigger('prebuild-source-gate.yml', simple)
          replace_trigger('dependency-bootstrap.yml', simple)

          signing = '''on:
            workflow_call:
              secrets:
                SIGNING_KEY:
                  required: true
                KEY_STORE_PASSWORD:
                  required: true
                KEY_ALIAS:
                  required: true
                KEY_PASSWORD:
                  required: true'''
          # Remove indentation introduced by Python source formatting.
          signing = '\n'.join(line[10:] if line.startswith('          ') else line for line in signing.splitlines())
          replace_trigger('apk-candidate.yml', signing)
          replace_trigger('signing-identity-bootstrap.yml', signing)

          # Firebase stays directly hosted in Tools because its GCP/Firebase configuration is already registered here.
          # It now binds to a private source repository/run using a dedicated read-only token.
          p = root / 'firebase-test-lab.yml'
          text = p.read_text()
          needle = '''      source_run_id:
                description: GitHub Actions run ID that produced the approved APK artifact
                required: false
                type: string
          '''
          if needle not in text:
              # Match exact current indentation instead of silently skipping.
              needle = '''      source_run_id:
                description: GitHub Actions run ID that produced the approved APK artifact
                required: false
                type: string
'''
          insert = '''      source_repository:
                description: Private source repository containing the approved APK run
                required: true
                default: RMTampu/ToolBox
                type: string
              source_run_id:
                description: GitHub Actions run ID that produced the approved APK artifact
                required: false
                type: string
'''
          # Normalize indentation of replacement to the existing six-space input indentation.
          insert = '\n'.join(line[6:] if line.startswith('      ') else line for line in insert.splitlines()) + '\n'
          if needle in text:
              text = text.replace(needle, insert, 1)
          elif '      source_repository:' not in text:
              raise SystemExit('firebase source_run_id input block not found')

          text = text.replace('GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}', 'GH_TOKEN: ${{ secrets.TOOLBOX_SOURCE_TOKEN }}', 1)
          text = text.replace("repo = os.environ['GITHUB_REPOSITORY']", "repo = '${{ inputs.source_repository }}'", 1)

          artifact_token = '          github-token: ${{ secrets.GITHUB_TOKEN }}\n          run-id: ${{ inputs.source_run_id }}'
          artifact_repl = '          github-token: ${{ secrets.TOOLBOX_SOURCE_TOKEN }}\n          repository: ${{ inputs.source_repository }}\n          run-id: ${{ inputs.source_run_id }}'
          if artifact_token in text:
              text = text.replace(artifact_token, artifact_repl, 1)
          elif 'repository: ${{ inputs.source_repository }}' not in text:
              raise SystemExit('firebase download-artifact token block not found')

          # Record the source repository in consumed authorization evidence and summary.
          text = text.replace('source_run_id=${{ inputs.source_run_id }}', 'source_repository=${{ inputs.source_repository }}\n          source_run_id=${{ inputs.source_run_id }}', 1)
          text = text.replace('echo "- Source workflow run: \\`${{ inputs.source_run_id }}\\`"', 'echo "- Source repository: \\`${{ inputs.source_repository }}\\`"\n            echo "- Source workflow run: \\`${{ inputs.source_run_id }}\\`"', 1)
          p.write_text(text)
          PY

          rm -f .github/workflows/convert-to-reusable.yml
          git config user.name 'Tools CI Migration Bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Convert Tools to reusable caller-source CI workflows'
          git push origin HEAD:main
