name: One-time Firebase Connection Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-connection-check.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  connection-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate Firebase connection configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '582.0.0'
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify Google Cloud project access
        shell: bash
        run: |
          set -euo pipefail
          gcloud --quiet config set project "$GCP_PROJECT_ID"
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"
          gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectId)' | grep -Fx "$GCP_PROJECT_ID"
          test -n "$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"

      - name: Verify Firebase Test Lab catalog access
        shell: bash
        run: |
          set -euo pipefail
          catalog="$RUNNER_TEMP/firebase-models.json"
          gcloud firebase test android models list --project="$GCP_PROJECT_ID" --format=json > "$catalog"
          test -s "$catalog"
          count="$(jq 'length' "$catalog")"
          test "$count" -gt 0
          api30_arm64="$(jq '[.[] | select(((.supportedVersionIds // []) | index("30")) != null) | select(any(.supportedAbis[]?; . == "arm64-v8a" or endswith(":arm64-v8a")))] | length' "$catalog")"
          echo "FIREBASE_CONNECTION=PASS"
          echo "MODEL_COUNT=$count"
          echo "API30_ARM64_MODEL_COUNT=$api30_arm64"
          echo "Firebase connection-only check completed. No test matrix was submitted." >> "$GITHUB_STEP_SUMMARY"
          echo "API30 ARM64 compatible model count: $api30_arm64" >> "$GITHUB_STEP_SUMMARY"
