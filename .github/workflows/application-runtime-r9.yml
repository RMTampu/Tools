name: ToolBox Android 11 ARM64 Runtime R9

on:
  push:
    branches: [kernel-foundation-hardening]

permissions:
  contents: read
  actions: read

jobs:
  locate-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      - name: Wait for exact successful static candidate
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROOF_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys,time,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['PROOF_SHA'].lower()
          token=os.environ['GH_TOKEN']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'toolbox-runtime-r9',
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          query=urllib.parse.urlencode({
              'head_sha':sha,
              'branch':'kernel-foundation-hardening',
              'per_page':100,
          })
          deadline=time.monotonic()+(45*60)
          last=None
          while time.monotonic()<deadline:
              runs=get(f'https://api.github.com/repos/{repo}/actions/runs?{query}').get('workflow_runs',[])
              matching=[
                  run for run in runs
                  if run.get('name')=='ToolBox Application Safe 100'
                  and str(run.get('head_sha','')).lower()==sha
              ]
              if matching:
                  selected=max(matching,key=lambda run:run['id'])
                  state=(selected.get('status'),selected.get('conclusion'))
                  if state!=last:
                      print(f"STATIC_RUN={selected['id']} STATUS={state[0]} CONCLUSION={state[1]}",flush=True)
                      last=state
                  if selected.get('status')=='completed':
                      if selected.get('conclusion')!='success':
                          raise SystemExit(
                              f"exact static run {selected['id']} completed as {selected.get('conclusion')}"
                          )
                      artifacts=get(
                          f"https://api.github.com/repos/{repo}/actions/runs/{selected['id']}/artifacts?per_page=100"
                      ).get('artifacts',[])
                      valid=[
                          artifact for artifact in artifacts
                          if artifact.get('name')=='toolbox-android11-arm64-static-candidate'
                          and not artifact.get('expired',False)
                      ]
                      if valid:
                          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
                              output.write(f"run_id={selected['id']}\n")
                          print(f"EXACT_STATIC_RUN_ID={selected['id']}")
                          sys.exit(0)
              time.sleep(20)
          raise SystemExit('STATIC_CANDIDATE_WAIT_TIMEOUT: exact successful static candidate did not appear within 45 minutes')
          PY

  runtime-r9:
    needs: locate-static
    runs-on: [self-hosted, linux, toolbox-android11-arm64-runtime]
    timeout-minutes: 90
    concurrency:
      group: toolbox-android11-arm64-physical-runtime
      cancel-in-progress: false
    env:
      PROOF_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject stale proof revision before device access
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote origin refs/heads/kernel-foundation-hardening | awk 'NR==1{print $1}')"
          test -n "$CURRENT"
          if [ "$CURRENT" != "$PROOF_SHA" ]; then
            echo "RUNTIME_PROOF_STALE: proof=$PROOF_SHA branch=$CURRENT"
            exit 1
          fi
          echo "RUNTIME_PROOF_CURRENT=$PROOF_SHA"

      - name: Download exact static candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: toolbox-android11-arm64-static-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.locate-static.outputs.run_id }}

      - name: Restore canonical static evidence and locate exact APKs
        shell: bash
        run: |
          set -euo pipefail
          test -d candidate/evidence
          test -d candidate/candidate-apks
          test ! -e candidate/verification
          rm -rf verification/evidence
          mkdir -p verification/evidence
          cp -R candidate/evidence/. verification/evidence/
          DEBUG_APK="$GITHUB_WORKSPACE/candidate/candidate-apks/toolbox-app-debug.apk"
          RELEASE_APK="$GITHUB_WORKSPACE/candidate/candidate-apks/toolbox-app-release.apk"
          TEST_APK="$GITHUB_WORKSPACE/candidate/candidate-apks/toolbox-app-debug-androidTest.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$TEST_APK"
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "TEST_APK=$TEST_APK" >> "$GITHUB_ENV"

      - name: Verify downloaded artifact provenance before runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          proof=os.environ['PROOF_SHA'].lower()
          provenance=json.loads(Path('verification/evidence/artifacts/provenance.json').read_text())
          if provenance.get('gitSha')!=proof:
              raise SystemExit('provenance revision mismatch')
          for env_name,key in [('DEBUG_APK','debug'),('RELEASE_APK','release'),('TEST_APK','androidTest')]:
              path=Path(os.environ[env_name])
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              expected=provenance['artifacts'][key]['sha256']
              if actual!=expected:
                  raise SystemExit(f'{key} digest mismatch')
          print('EXACT_STATIC_CANDIDATE_PROVENANCE_PASS')
          PY

      - name: Qualify and bind attached Android 11 ARM64 runtime
        run: GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/runtime_environment_gate.py

      - name: Run instrumentation against exact debug APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SERIAL:-}"
          mkdir -p verification/evidence/diagnostics
          adb -s "$ANDROID_SERIAL" install -t "$DEBUG_APK"
          adb -s "$ANDROID_SERIAL" install -t "$TEST_APK"
          adb -s "$ANDROID_SERIAL" shell am instrument -w io.toolbox.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee verification/evidence/diagnostics/instrumentation-debug.txt
          GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/instrumentation_gate.py \
            --report verification/evidence/diagnostics/instrumentation-debug.txt \
            --apk "$DEBUG_APK" \
            --test-apk "$TEST_APK" \
            --provenance verification/evidence/artifacts/provenance.json

      - name: Isolate post-instrumentation state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SERIAL:-}"
          adb -s "$ANDROID_SERIAL" uninstall io.toolbox.app.debug.test | grep -Fx 'Success'
          adb -s "$ANDROID_SERIAL" uninstall io.toolbox.app.debug | grep -Fx 'Success'
          test -z "$(adb -s "$ANDROID_SERIAL" shell pm path io.toolbox.app.debug.test 2>/dev/null | tr -d '\r')"
          test -z "$(adb -s "$ANDROID_SERIAL" shell pm path io.toolbox.app.debug 2>/dev/null | tr -d '\r')"

      - name: Runtime gate exact debug APK
        run: GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/runtime_gate.py --apk "$DEBUG_APK" --package io.toolbox.app.debug --variant debug

      - name: Isolate debug runtime before release
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SERIAL:-}"
          adb -s "$ANDROID_SERIAL" uninstall io.toolbox.app.debug | grep -Fx 'Success'
          test -z "$(adb -s "$ANDROID_SERIAL" shell pm path io.toolbox.app.debug 2>/dev/null | tr -d '\r')"
          test -z "$(adb -s "$ANDROID_SERIAL" shell pm path io.toolbox.app 2>/dev/null | tr -d '\r')"

      - name: Runtime gate exact release APK
        run: GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/runtime_gate.py --apk "$RELEASE_APK" --package io.toolbox.app --variant release

      - name: Final ASSET_SAFE_100 closure
        run: GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/asset_final_gate.py

      - name: Cross-domain X1-X5 closure
        run: GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/cross_domain_gate.py

      - name: R1-R9 final APPLICATION_SAFE_100 closure
        run: GITHUB_SHA="$PROOF_SHA" python3 verification/scripts/application_safe_100_gate.py

      - name: Prepare exact final APK distribution set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-apks
          cp "$DEBUG_APK" final-apks/ToolBox-debug.apk
          cp "$RELEASE_APK" final-apks/ToolBox-release.apk
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          safe=json.loads(Path('verification/evidence/application-safe-100.json').read_text())
          if safe.get('status')!='PASS':
              raise SystemExit('APPLICATION_SAFE_100 missing')
          apks=[Path('final-apks/ToolBox-debug.apk'),Path('final-apks/ToolBox-release.apk')]
          Path('final-apks/SHA256SUMS').write_text(
              '\n'.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}' for path in apks)+'\n'
          )
          Path('final-apks/APPLICATION_SAFE_100.json').write_text(
              json.dumps(safe,indent=2,sort_keys=True)+'\n'
          )
          PY

      - name: Upload final verified APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: toolbox-android11-arm64-verified-apks
          path: final-apks/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup installed candidates
        if: always()
        shell: bash
        run: |
          if [ -n "${ANDROID_SERIAL:-}" ]; then
            adb -s "$ANDROID_SERIAL" uninstall io.toolbox.app.debug.test >/dev/null 2>&1 || true
            adb -s "$ANDROID_SERIAL" uninstall io.toolbox.app.debug >/dev/null 2>&1 || true
            adb -s "$ANDROID_SERIAL" uninstall io.toolbox.app >/dev/null 2>&1 || true
          fi

      - name: Publish final application assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: application-assurance-evidence-final
          path: verification/evidence/
          if-no-files-found: warn
          retention-days: 30
