name: ToolBox Android Tool Trust Refresh

on:
  push:
    branches: [kernel-foundation-hardening]
    paths:
      - '.github/workflows/aapt2-trust-refresh.yml'
      - 'toolbox-app/build.gradle.kts'
      - 'toolbox-app/src/main/**'
      - 'gradle/verification-metadata.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-android-tool-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup exact Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Setup exact Android tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install declared Android inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-30' 'platforms;android-35' 'build-tools;34.0.0'
          test -s "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"

      - name: Create independent clean replicas
        shell: bash
        run: |
          set -euo pipefail
          for replica in a b; do
            dir="$RUNNER_TEMP/source-$replica"
            rm -rf "$dir" "$RUNNER_TEMP/gradle-home-$replica"
            mkdir -p "$dir"
            git archive HEAD | tar -x -C "$dir"
          done

      - name: Resolve complete Android tool surface in replica A
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-a
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$RUNNER_TEMP/source-a" --no-daemon --refresh-dependencies \
            --write-verification-metadata sha256 \
            :toolbox-app:processDebugResources \
            :toolbox-app:lintDebug \
            :toolbox-app:lintRelease

      - name: Resolve complete Android tool surface in replica B
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-b
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$RUNNER_TEMP/source-b" --no-daemon --refresh-dependencies \
            --write-verification-metadata sha256 \
            :toolbox-app:processDebugResources \
            :toolbox-app:lintDebug \
            :toolbox-app:lintRelease

      - name: Require complete trust convergence
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/source-a/gradle/verification-metadata.xml" "$RUNNER_TEMP/source-b/gradle/verification-metadata.xml"
          python3 - <<'PY'
          import hashlib, os, pathlib, xml.etree.ElementTree as ET
          ns={'v':'https://schema.gradle.org/dependency-verification'}
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          p=base/'source-a/gradle/verification-metadata.xml'
          root=ET.parse(p).getroot()
          components=root.find('v:components',ns)
          artifacts=[]
          missing=[]
          for comp in components.findall('v:component',ns):
              coord=(comp.attrib.get('group'),comp.attrib.get('name'),comp.attrib.get('version'))
              for art in comp.findall('v:artifact',ns):
                  hashes=[x.attrib.get('value') for x in art.findall('v:sha256',ns) if x.attrib.get('value')]
                  artifacts.append((*coord,art.attrib.get('name'),tuple(sorted(hashes))))
                  if not hashes:
                      missing.append((*coord,art.attrib.get('name')))
          if missing:
              raise SystemExit(f'artifacts without SHA-256: {missing[:20]}')
          raw=p.read_bytes()
          print('TRUST_METADATA_SHA256='+hashlib.sha256(raw).hexdigest())
          print('TRUSTED_ARTIFACT_COUNT='+str(len(artifacts)))
          required={
            ('com.android.tools.build','aapt2','8.6.1-11315950','aapt2-8.6.1-11315950-linux.jar'),
            ('com.android.tools.lint','lint','31.6.1','lint-31.6.1.jar'),
            ('com.android.tools.lint','lint-api','31.6.1','lint-api-31.6.1.jar'),
            ('com.android.tools.lint','lint-checks','31.6.1','lint-checks-31.6.1.jar'),
            ('com.android.tools.lint','lint-gradle','31.6.1','lint-gradle-31.6.1.jar'),
          }
          observed={(g,n,v,a) for g,n,v,a,h in artifacts if h}
          absent=required-observed
          if absent:
              raise SystemExit(f'required Android tool trust missing: {sorted(absent)}')
          PY

      - name: Package converged trust evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-tool-trust-evidence"
          cp "$RUNNER_TEMP/source-a/gradle/verification-metadata.xml" "$RUNNER_TEMP/android-tool-trust-evidence/verification-metadata-a.xml"
          cp "$RUNNER_TEMP/source-b/gradle/verification-metadata.xml" "$RUNNER_TEMP/android-tool-trust-evidence/verification-metadata-b.xml"
          sha256sum "$RUNNER_TEMP/android-tool-trust-evidence/"*.xml > "$RUNNER_TEMP/android-tool-trust-evidence/SHA256SUMS"

      - name: Upload converged trust evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-tool-trust-evidence
          path: ${{ runner.temp }}/android-tool-trust-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Promote exact converged metadata to current branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='kernel-foundation-hardening'
          API="https://api.github.com/repos/$REPOSITORY"
          HEAD_SHA="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API/git/ref/heads/$BRANCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$HEAD_SHA" = "$SOURCE_SHA"
          CURRENT_BLOB="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$API/contents/gradle/verification-metadata.xml?ref=$BRANCH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          export CURRENT_BLOB BRANCH
          python3 - <<'PY'
          import base64,json,os,pathlib
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'source-a/gradle/verification-metadata.xml'
          body={'message':'Trust independently verified Android build tools','content':base64.b64encode(source.read_bytes()).decode(),'sha':os.environ['CURRENT_BLOB'],'branch':os.environ['BRANCH']}
          pathlib.Path(os.environ['RUNNER_TEMP']+'/promote.json').write_text(json.dumps(body))
          PY
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/contents/gradle/verification-metadata.xml" \
            --data-binary "@$RUNNER_TEMP/promote.json" > "$RUNNER_TEMP/promote-response.json"
          python3 - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/promote-response.json').read_text())
          print('PROMOTED_COMMIT='+data['commit']['sha'])
          PY
