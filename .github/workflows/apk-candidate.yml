name: ToolBox APK Candidate Gate

on:
  workflow_call:
    secrets:
      SIGNING_KEY:
        required: true
      KEY_STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  apk-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact caller revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Record caller and CI provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_REPOSITORY=$GITHUB_REPOSITORY"
          echo "SOURCE_COMMIT_SHA=$GITHUB_SHA"
          echo "SOURCE_REF=$GITHUB_REF"
          echo "CI_REPOSITORY=RMTampu/Tools"
          echo "CI_WORKFLOW_REF=${{ github.workflow_ref }}"

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup Gradle 8.7 without shared cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Setup Android command line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install declared Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-30' 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'
          test -s "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
          test -s "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign"

      - name: Dependency trust gate
        shell: bash
        run: python3 verification/scripts/dependency_trust_gate.py

      - name: Application source prebuild gate
        shell: bash
        run: python3 verification/scripts/prebuild_gate.py

      - name: Asset and route prebuild gate
        shell: bash
        run: python3 verification/scripts/asset_prebuild_gate.py

      - name: Confirm prebuild unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('verification/evidence/prebuild.json').read_text())
          asset=json.loads(Path('verification/evidence/asset-prebuild.json').read_text())
          if source.get('status') != 'PASS': raise SystemExit('APPLICATION_PREBUILD_SOURCE_GATE != PASS')
          if asset.get('status') != 'PASS': raise SystemExit('ASSET_PREBUILD_GATE != PASS')
          if asset.get('stages',{}).get('ASSET_SAFE_S5') != 'PASS': raise SystemExit('ASSET_SAFE_S5 != PASS')
          if asset.get('stages',{}).get('BUILD_UNLOCKED') is not True: raise SystemExit('BUILD_UNLOCKED != TRUE')
          print('PREBUILD_ASSET_GATE = PASS')
          print('BUILD_UNLOCKED = TRUE')
          PY

      - name: Kernel tests
        shell: bash
        run: gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-kernel:test

      - name: Application unit tests
        shell: bash
        run: >-
          gradle --no-daemon --warning-mode=all --dependency-verification strict
          -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          :toolbox-app:testDebugUnitTest
          :toolbox-app:testReleaseUnitTest

      - name: Application lint
        shell: bash
        run: >-
          gradle --no-daemon --warning-mode=all --dependency-verification strict
          -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          :toolbox-app:lintDebug
          :toolbox-app:lintRelease

      - name: Materialize and verify release signing identity
        id: signing
        shell: bash
        env:
          TOOLBOX_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
          TOOLBOX_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          TOOLBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOLBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TOOLBOX_KEYSTORE_BASE64"
          test -n "$TOOLBOX_KEYSTORE_PASSWORD"
          test -n "$TOOLBOX_KEY_ALIAS"
          test -n "$TOOLBOX_KEY_PASSWORD"
          umask 077
          KEYSTORE="$RUNNER_TEMP/toolbox-release.keystore"
          CERT_DER="$RUNNER_TEMP/toolbox-release-cert.der"
          printf '%s' "$TOOLBOX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -storepass "$TOOLBOX_KEYSTORE_PASSWORD" -alias "$TOOLBOX_KEY_ALIAS" -file "$CERT_DER"
          ACTUAL="$(sha256sum "$CERT_DER" | awk '{print tolower($1)}')"
          EXPECTED="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(str(json.loads(Path('verification/signing_contract.json').read_text())['release']['expectedCertificateSha256']).lower())
          PY
          )"
          test "$ACTUAL" = "$EXPECTED"
          echo "TOOLBOX_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "TOOLBOX_KEYSTORE_PASSWORD=$TOOLBOX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TOOLBOX_KEY_ALIAS=$TOOLBOX_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TOOLBOX_KEY_PASSWORD=$TOOLBOX_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "certificate_sha256=$ACTUAL" >> "$GITHUB_OUTPUT"
          rm -f "$CERT_DER"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --warning-mode=all --dependency-verification strict :toolbox-app:clean
          gradle --no-daemon --warning-mode=all --dependency-verification strict \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" \
            :toolbox-app:assembleRelease \
            :toolbox-app:writeReleaseDependencyInventory
          APK="toolbox-app/build/outputs/apk/release/toolbox-app-release.apk"
          test -s "$APK"
          MANIFEST="$(find toolbox-app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests)/release/' | head -n1)"
          test -n "$MANIFEST"
          test -s "$MANIFEST"
          mkdir -p verification/firebase-candidate verification/evidence/apk-candidate
          cp "$APK" verification/firebase-candidate/toolbox-app-release.apk
          cp "$MANIFEST" verification/evidence/apk-candidate/release-AndroidManifest.xml

      - name: Sign exact Android 11 release candidate
        shell: bash
        run: |
          set -euo pipefail
          APK=verification/firebase-candidate/toolbox-app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          mv "$RUNNER_TEMP/aligned.apk" "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign \
            --ks "$TOOLBOX_KEYSTORE_PATH" \
            --ks-pass env:TOOLBOX_KEYSTORE_PASSWORD \
            --ks-key-alias "$TOOLBOX_KEY_ALIAS" \
            --key-pass env:TOOLBOX_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "$APK"

      - name: Final APK verification
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          APK=verification/firebase-candidate/toolbox-app-release.apk
          MANIFEST=verification/evidence/apk-candidate/release-AndroidManifest.xml
          python3 verification/scripts/apk_gate.py --apk "$APK" --manifest-xml "$MANIFEST" --variant release
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -c -p -v 4 "$APK"
          REPORT=verification/evidence/apk-candidate/release-signature-api30.txt
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 30 --max-sdk-version 30 "$APK" | tee "$REPORT"
          grep -E 'Verified using v3 scheme.*:[[:space:]]*true' "$REPORT"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$REPORT" | head -n1 | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"

      - name: Record candidate provenance
        shell: bash
        env:
          CERTIFICATE_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path('verification/firebase-candidate/toolbox-app-release.apk')
          h=hashlib.sha256(apk.read_bytes()).hexdigest()
          payload={
              'schemaVersion':2,
              'status':'FIREBASE_READY_CANDIDATE',
              'sourceRepository':os.environ['GITHUB_REPOSITORY'],
              'sourceCommitSha':os.environ['GITHUB_SHA'],
              'sourceRef':os.environ['GITHUB_REF'],
              'sourceWorkflowRunId':os.environ['GITHUB_RUN_ID'],
              'ciRepository':'RMTampu/Tools',
              'apk':{
                  'artifactName':'toolbox-apk',
                  'fileName':apk.name,
                  'sha256':h,
                  'sizeBytes':apk.stat().st_size,
                  'certificateSha256':os.environ['CERTIFICATE_SHA256'].lower()
              },
              'target':{'androidApi':30,'abi':'arm64-v8a'},
              'firebaseAuthorization':'LOCKED'
          }
          Path('verification/evidence/apk-candidate/provenance.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print('APK_SHA256='+h)
          PY

      - name: Upload signed APK candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: toolbox-apk
          path: |
            verification/firebase-candidate/toolbox-app-release.apk
            verification/evidence/apk-candidate/provenance.json
            verification/evidence/apk-candidate/release-signature-api30.txt
          if-no-files-found: error
          retention-days: 14
