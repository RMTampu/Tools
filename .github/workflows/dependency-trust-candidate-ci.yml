name: Kernel Dependency Trust Candidate

on:
  push:
    branches: [kernel-foundation-hardening]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'toolbox-kernel/build.gradle.kts'
      - 'toolbox-app/build.gradle.kts'
      - '.github/workflows/dependency-trust-candidate-ci.yml'

permissions:
  contents: write

jobs:
  dependency-trust-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Verify exact Java runtime
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$RUNNER_TEMP/java-version.txt"
          grep -F 'openjdk version "17.0.20.1"' "$RUNNER_TEMP/java-version.txt"
          grep -F 'Temurin-17.0.20.1+1' "$RUNNER_TEMP/java-version.txt"
          test -s "$JAVA_HOME/release"
          grep -F 'JAVA_VERSION="17.0.20.1"' "$JAVA_HOME/release"
          grep -F 'IMPLEMENTOR="Eclipse Adoptium"' "$JAVA_HOME/release"

      - name: Setup Gradle 8.7 without shared dependency cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Verify Gradle distribution identity
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          GRADLE_ZIP="$RUNNER_TEMP/.gradle-actions/gradle-installations/downloads/gradle-8.7-bin.zip"
          test -f "$GRADLE_ZIP"
          echo '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  '"$GRADLE_ZIP" | sha256sum -c -

      - name: Setup exact Android SDK command line tools only
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install declared Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
          test -s "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -s "$ANDROID_SDK_ROOT/build-tools/34.0.0/source.properties"

      - name: Create two clean source replicas
        shell: bash
        run: |
          set -euo pipefail
          for replica in a b; do
            dir="$RUNNER_TEMP/source-$replica"
            rm -rf "$dir" "$RUNNER_TEMP/gradle-home-$replica"
            mkdir -p "$dir"
            git archive HEAD | tar -x -C "$dir"
            rm -f \
              "$dir/toolbox-kernel/gradle.lockfile" \
              "$dir/toolbox-app/gradle.lockfile" \
              "$dir/gradle/verification-metadata.xml" \
              "$dir/verification/dependency_trust_candidate.json"
          done

      - name: Resolve replica A from clean Gradle home
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-a
        run: >-
          gradle -p "$RUNNER_TEMP/source-a"
          --no-daemon
          --refresh-dependencies
          --write-locks
          --write-verification-metadata sha256
          :toolbox-kernel:dependencies
          :toolbox-app:dependencies

      - name: Resolve replica B from clean Gradle home
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-b
        run: >-
          gradle -p "$RUNNER_TEMP/source-b"
          --no-daemon
          --refresh-dependencies
          --write-locks
          --write-verification-metadata sha256
          :toolbox-kernel:dependencies
          :toolbox-app:dependencies

      - name: Require independent resolution convergence
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/source-a/toolbox-kernel/gradle.lockfile" "$RUNNER_TEMP/source-b/toolbox-kernel/gradle.lockfile"
          cmp "$RUNNER_TEMP/source-a/toolbox-app/gradle.lockfile" "$RUNNER_TEMP/source-b/toolbox-app/gradle.lockfile"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          ns = {'v': 'https://schema.gradle.org/dependency-verification'}
          def canonical(path: pathlib.Path):
              root = ET.parse(path).getroot()
              config = root.find('v:configuration', ns)
              components = root.find('v:components', ns)
              if components is None:
                  raise SystemExit(f'components missing in {path}')
              rows = []
              for component in components.findall('v:component', ns):
                  coord = (component.attrib.get('group',''), component.attrib.get('name',''), component.attrib.get('version',''))
                  for artifact in component.findall('v:artifact', ns):
                      hashes = sorted({x.attrib.get('value','') for x in artifact.findall('v:sha256', ns) if x.attrib.get('value')})
                      if not hashes:
                          raise SystemExit(f'artifact without SHA-256: {coord} {artifact.attrib.get("name","")}')
                      rows.append((*coord, artifact.attrib.get('name',''), tuple(hashes)))
              rows.sort()
              return {
                  'verifyMetadata': config.findtext('v:verify-metadata', default='', namespaces=ns) if config is not None else '',
                  'verifySignatures': config.findtext('v:verify-signatures', default='', namespaces=ns) if config is not None else '',
                  'artifacts': rows,
              }
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          a = canonical(base / 'source-a/gradle/verification-metadata.xml')
          b = canonical(base / 'source-b/gradle/verification-metadata.xml')
          if a != b:
              raise SystemExit('independent clean verification metadata did not converge')
          print(f'converged verified artifacts: {len(a["artifacts"])}')
          PY

      - name: Promote converged state to working tree
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/source-a/toolbox-kernel/gradle.lockfile" toolbox-kernel/gradle.lockfile
          cp "$RUNNER_TEMP/source-a/toolbox-app/gradle.lockfile" toolbox-app/gradle.lockfile
          cp "$RUNNER_TEMP/source-a/gradle/verification-metadata.xml" gradle/verification-metadata.xml

      - name: Record dependency trust candidate evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          candidate={
              'schemaVersion': 4,
              'status': 'CANDIDATE_CONVERGED_REVIEWED_FOR_HARDENING',
              'generatedFromGitSha': os.environ['GITHUB_SHA'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'generator': {
                  'gradle': '8.7',
                  'gradleDistributionSha256': '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d',
                  'jdk': '17.0.20+1',
                  'dependencyVerification': 'sha256',
                  'independentCleanReplicas': 2,
                  'sharedDependencyCache': False,
              },
              'outputsSha256': {
                  'toolbox-kernel/gradle.lockfile': sha('toolbox-kernel/gradle.lockfile'),
                  'toolbox-app/gradle.lockfile': sha('toolbox-app/gradle.lockfile'),
                  'gradle/verification-metadata.xml': sha('gradle/verification-metadata.xml'),
              },
          }
          pathlib.Path('verification/dependency_trust_candidate.json').write_text(json.dumps(candidate,indent=2,sort_keys=True)+'\n')
          PY

      - name: Package dependency trust evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-trust-candidate"
          cp toolbox-kernel/gradle.lockfile "$RUNNER_TEMP/dependency-trust-candidate/toolbox-kernel.gradle.lockfile"
          cp toolbox-app/gradle.lockfile "$RUNNER_TEMP/dependency-trust-candidate/toolbox-app.gradle.lockfile"
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/dependency-trust-candidate/verification-metadata.xml"
          cp verification/dependency_trust_candidate.json "$RUNNER_TEMP/dependency-trust-candidate/dependency_trust_candidate.json"
          (
            cd "$RUNNER_TEMP/dependency-trust-candidate"
            sha256sum *.lockfile verification-metadata.xml dependency_trust_candidate.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload dependency trust evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: kernel-dependency-trust-candidate
          path: ${{ runner.temp }}/dependency-trust-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Commit converged trust state to hardening branch
        shell: bash
        run: |
          set -euo pipefail
          git add toolbox-kernel/gradle.lockfile toolbox-app/gradle.lockfile gradle/verification-metadata.xml verification/dependency_trust_candidate.json
          if git diff --cached --quiet; then
            echo 'Dependency trust state already current.'
            exit 0
          fi
          git config user.name 'toolbox-trust-bootstrap[bot]'
          git config user.email 'toolbox-trust-bootstrap[bot]@users.noreply.github.com'
          git commit -m 'Record converged dependency trust state for hardening'
          git push origin HEAD:kernel-foundation-hardening
