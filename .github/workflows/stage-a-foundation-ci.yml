name: ToolBox Public Stage A Foundation CI

on:
  push:
    branches:
      - main
      - stage-a-public-closure
    paths:
      - 'public-components/stage-a-foundation/**'
      - 'public-components/runtime-contracts/**'
      - 'public-components/runtime-safety-contracts/**'
      - '.github/workflows/stage-a-foundation-ci.yml'
      - 'AGENTS.md'
      - 'GLOBAL_PUBLIC_PRIVATE_DEVELOPMENT_RULES.md'
      - 'PETA-PEMAKAIAN-MD.md'
      - 'REPOSITORY_INTEGRATION_POLICY.md'
      - 'TEST_ROUTING_POLICY.md'
      - 'AGENT_PROCEDURE_EXECUTION_RULES.md'
      - 'APPLICATION_SAFE_100_PROCESS.md'
      - 'APP_SAFE_R*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-stage-a-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-stage-a-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Enforce Public boundary and Stage A boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "RMTampu/Tools"
          echo 'PUBLIC_PRIVATE_READ_ACCESS=0'
          echo 'PRIVATE_CONTENT_INCLUDED=0'
          echo 'PUBLIC_FINAL_BUILD=0'
          echo 'PUBLIC_FIREBASE_ACCESS=0'
          echo 'A1_A4_PRIVATE_BOUNDARIES=0'
          echo 'STAGE_A_IS_SINGLE_PROMOTION_BOUNDARY=1'

      - name: Checkout exact Public revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.7'
          check-latest: false

      - name: Verify pinned runtimes
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          python --version
          python3 --version

      - name: Stage A R1-R8 prebuild assurance gate
        shell: bash
        run: python3 public-components/stage-a-foundation/scripts/assurance_prebuild.py

      - name: Revalidate runtime contracts dependency
        shell: bash
        run: bash public-components/runtime-contracts/scripts/run-tests.sh

      - name: Revalidate runtime safety dependency
        shell: bash
        run: bash public-components/runtime-safety-contracts/scripts/run-tests.sh

      - name: Compile and execute consolidated Stage A tests
        shell: bash
        run: bash public-components/stage-a-foundation/scripts/run-tests.sh

      - name: Stage A mutation challenge
        shell: bash
        run: python3 public-components/stage-a-foundation/scripts/mutation_test.py

      - name: R9 Stage A Public evidence completeness gate
        shell: bash
        run: python3 public-components/stage-a-foundation/scripts/assurance_finalize.py

      - name: Validate consolidated Stage A Promotion Package
        shell: bash
        run: python3 public-components/stage-a-foundation/scripts/package_validate.py

      - name: Verify STAGE_A_READY_PRIVATE manifest binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('public-components/stage-a-foundation')
          manifest = json.loads((root/'build/promotion/stage-a-promotion-manifest.json').read_text())
          evidence = json.loads((root/'build/assurance/r1-r9-stage-a-evidence.json').read_text())
          handoff = json.loads((root/'PRIVATE_INTEGRATION_REQUIREMENTS.json').read_text())
          assert manifest['status'] == 'STAGE_A_READY_PRIVATE'
          assert manifest['sourceRepository'] == 'RMTampu/Tools'
          assert manifest['sourceCommitSha'] == os.environ['GITHUB_SHA']
          assert manifest['workflowRunId'] == os.environ['GITHUB_RUN_ID']
          assert manifest['promotionBoundary'] == 'STAGE_ONLY'
          assert manifest['substeps'] == ['A1','A2','A3','A4']
          assert manifest['substepsArePrivateBoundaries'] is False
          assert manifest['componentReadyPrivateAuthorizesPrivateStageIntegration'] is False
          assert manifest['productionSourceArchive']['sourceCount'] == 12
          assert manifest['productionSourceArchive']['simulatorSourceIncluded'] is False
          assert manifest['productionSourceArchive']['testSourceIncluded'] is False
          assert manifest['assurance']['r1ToR9PublicStageClosure'] == 'PASS'
          assert manifest['assurance']['registryIntegrationSimulator'] == 'PASS'
          assert manifest['assurance']['mutationChallenge'] == 'PASS'
          assert manifest['assurance']['unknown'] == 0
          assert manifest['assurance']['skipped'] == 0
          assert manifest['assurance']['staleEvidence'] == 0
          assert manifest['assurance']['finalApplicationSafe100Claimed'] is False
          assert manifest['publicBoundaries']['privateContentIncluded'] is False
          assert manifest['publicBoundaries']['privateReadAccess'] is False
          assert manifest['publicBoundaries']['privateExecutionThroughPublic'] is False
          assert manifest['publicBoundaries']['androidRuntimeClaimed'] is False
          assert manifest['publicBoundaries']['firebaseUsed'] is False
          assert evidence['status'] == 'PASS'
          assert evidence['sourceCommitSha'] == os.environ['GITHUB_SHA']
          assert evidence['workflowRunId'] == os.environ['GITHUB_RUN_ID']
          assert evidence['closure']['unknown'] == 0
          assert evidence['closure']['skipped'] == 0
          assert evidence['closure']['notProvenWithinPublicStageScope'] == 0
          assert evidence['closure']['staleEvidence'] == 0
          assert evidence['closure']['mutationEscape'] == 0
          assert handoff['handoffType'] == 'CONSOLIDATED_STAGE_A'
          assert handoff['requiredStatus'] == 'STAGE_A_READY_PRIVATE'
          assert handoff['integration']['singleStageTransaction'] is True
          assert handoff['integration']['a1ToA4SeparatePrivatePromotionForbidden'] is True
          print('STAGE_A_READY_PRIVATE_BINDING = PASS')
          print('A1_A4_PRIVATE_BOUNDARIES = 0')
          print('PUBLIC_FIREBASE_ACCESS = 0')
          PY

      - name: Upload consolidated Stage A Promotion Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: toolbox-stage-a-ready-private
          path: |
            public-components/stage-a-foundation/build/promotion/toolbox-stage-a-ready-private.zip
            public-components/stage-a-foundation/build/promotion/toolbox-stage-a-1.0.0-production-sources.zip
            public-components/stage-a-foundation/build/promotion/stage-a-promotion-manifest.json
            public-components/stage-a-foundation/build/promotion/artifact-digests.json
            public-components/stage-a-foundation/build/package/toolbox-stage-a-foundation-0.1.0.jar
            public-components/stage-a-foundation/build/test-summary.txt
            public-components/stage-a-foundation/build/self-test-output.txt
            public-components/stage-a-foundation/build/property-test-output.txt
            public-components/stage-a-foundation/build/simulator-output.txt
            public-components/stage-a-foundation/build/assurance/prebuild-evidence.json
            public-components/stage-a-foundation/build/assurance/mutation-evidence.json
            public-components/stage-a-foundation/build/assurance/r1-r9-stage-a-evidence.json
            public-components/stage-a-foundation/COMPONENT_SPEC.json
            public-components/stage-a-foundation/CONTRACT.json
            public-components/stage-a-foundation/ASSURANCE_PLAN_R1_R9.json
            public-components/stage-a-foundation/PRIVATE_INTEGRATION_REQUIREMENTS.json
          if-no-files-found: error
          retention-days: 7

      - name: Auto Cleanup Public workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf public-components/stage-a-foundation/build
          rm -rf public-components/runtime-contracts/build
          rm -rf public-components/runtime-safety-contracts/build
          rm -rf public-components/stage-a-foundation/.assurance-state
          rm -rf "$RUNNER_TEMP"/stage-a-* 2>/dev/null || true
          echo 'PUBLIC_JOB_AUTO_CLEANUP = DONE'
