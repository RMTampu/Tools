name: ToolBox Public App Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/public-app-package.yml'
      - 'AGENTS.md'
      - 'TASK.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'ASSET_SAFE_100_RULES.md'
      - 'ASSET_SAFE_100_PROCESS.md'
      - 'ASSET_SAFE_100_METHODS.md'
      - 'ASSET_ROUTE_PROOF_PROCESS.md'
      - 'ASSET_ROUTE_PROOF_METHODS.md'
      - 'PREBUILD_ASSET_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-app-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-app-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 30 build inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-30' 'build-tools;34.0.0'
          test -s "$ANDROID_HOME/platforms/android-30/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Run public app unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble unsigned release package
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify package is ready for private signing
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          echo "PUBLIC_APP_UNSIGNED_RELEASE_READY_FOR_PRIVATE_SIGNING=1"

      - name: Upload unsigned package for private signing
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-public-app-unsigned-ready-private-signing
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 7
