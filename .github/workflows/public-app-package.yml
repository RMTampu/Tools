name: ToolBox Public Tahap 2 Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/public-app-package.yml'
      - 'AGENTS.md'
      - 'TASK.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'ASSET_SAFE_100_RULES.md'
      - 'ASSET_SAFE_100_PROCESS.md'
      - 'ASSET_SAFE_100_METHODS.md'
      - 'ASSET_ROUTE_PROOF_PROCESS.md'
      - 'ASSET_ROUTE_PROOF_METHODS.md'
      - 'PREBUILD_ASSET_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tahap2-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tahap2-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 30 build inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-30' 'build-tools;34.0.0'
          test -s "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Set up exact Gradle without shared cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Tahap 1 baseline compatibility and Tahap 2 route gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle=Path('app/build.gradle').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()

          assert "applicationId 'com.toolbox.tools'" in gradle
          assert re.search(r'\bminSdk\s+30\b', gradle)
          assert re.search(r'\btargetSdk\s+30\b', gradle)
          version=int(re.search(r'\bversionCode\s+(\d+)\b', gradle).group(1))
          assert version > 1
          assert 'android:name=".MainActivity"' in manifest
          assert 'android:exported="true"' in manifest

          required=[
              'app/src/main/java/com/toolbox/tools/core/StableId.java',
              'app/src/main/java/com/toolbox/tools/core/DigestUtils.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectAccessStatus.java',
              'app/src/main/java/com/toolbox/tools/core/StaleWriteException.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectState.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectDefinitionCodec.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectManifest.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectStore.java',
              'app/src/main/java/com/toolbox/tools/core/FileProjectStore.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectManager.java',
              'app/src/main/java/com/toolbox/tools/core/DraftRecoveryStore.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectMigrationRegistry.java',
              'app/src/main/java/com/toolbox/tools/core/RecoverySnapshotStore.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectAccessClassifier.java',
              'app/src/main/java/com/toolbox/tools/core/ProjectRelinkVerifier.java',
              'app/src/main/java/com/toolbox/tools/android/SafProjectAccessGateway.java',
              'app/src/test/java/com/toolbox/tools/core/ProjectDefinitionCodecTest.java',
              'app/src/test/java/com/toolbox/tools/core/ProjectManagerTest.java',
              'app/src/test/java/com/toolbox/tools/core/FileProjectStoreTest.java',
              'app/src/test/java/com/toolbox/tools/core/ProjectMigrationAndAccessTest.java',
              'app/src/test/java/com/toolbox/tools/core/RecoverySnapshotStoreTest.java',
              'app/src/test/java/com/toolbox/tools/core/ProjectRelinkVerifierTest.java',
          ]
          for item in required:
              assert Path(item).is_file(), item

          source='\n'.join(Path(p).read_text() for p in required if '/main/' in p)
          assertions=[
              'MAX_UNDO_GROUPS = 64',
              'MAX_REVISIONS = 32',
              'STALE_WRITE',
              'journal.pending',
              'project.manifest',
              'project.index',
              'resources',
              'ATOMIC_MOVE',
              'SHA-256',
              'recoverRevision',
              'previewRecovery',
              'ACCESS_LOST',
              'SCHEMA_INCOMPATIBLE',
              'FINAL_RECOVERY_SNAPSHOT',
              'LAST_VALID_RECOVERY',
              'takePersistableUriPermission',
          ]
          for marker in assertions:
              assert marker in source, marker

          old=[
              'app/src/main/java/com/toolbox/tools/core/WorkspaceSnapshot.java',
              'app/src/main/java/com/toolbox/tools/core/WorkspaceManager.java',
          ]
          for item in old:
              assert not Path(item).exists(), f'obsolete Tahap 2 model remains: {item}'

          forbidden=['SIGNING_KEY','KEY_STORE_PASSWORD','KEY_PASSWORD','FIREBASE_PROJECT_ID']
          for item in forbidden:
              assert item not in source

          print('BASELINE_TAHAP_1_COMPATIBILITY = PASS')
          print('TAHAP_2_B1_B4_ROUTE = PASS')
          print('PUBLIC_SECRET_BOUNDARY = PASS')
          PY

      - name: Automatic R1-R8 prebuild assurance from research corpus
        run: python3 app/scripts/assurance_prebuild.py

      - name: Run Tahap 2 unit failure transaction recovery tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Automatic R9 mutation challenge
        run: python3 app/scripts/mutation_test.py

      - name: Restore clean full test evidence after mutation challenge
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: Assemble Tahap 2 unsigned release package
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Tahap 2 package metadata and digest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.toolbox.tools'" <<< "$BADGING"
          grep -F "versionCode='2'" <<< "$BADGING"
          grep -F "sdkVersion:'30'" <<< "$BADGING"
          grep -F "targetSdkVersion:'30'" <<< "$BADGING"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "TAHAP_2_PUBLIC_UNSIGNED_APK = PASS"

      - name: Automatic R9 completeness and provenance closure
        run: python3 app/scripts/assurance_finalize.py

      - name: Upload Tahap 2 unsigned package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: toolbox-tahap2-public-unsigned-ready-private-signing
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/assurance/tahap2-r1-r8-prebuild-evidence.json
            app/build/assurance/tahap2-mutation-evidence.json
            app/build/assurance/tahap2-r1-r9-evidence.json
          if-no-files-found: error
          retention-days: 7
