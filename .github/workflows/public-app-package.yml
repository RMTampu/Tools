name: ToolBox Public Tahap 7 Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/public-app-package.yml'
      - 'AGENTS.md'
      - 'TASK.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'ASSET_SAFE_100_RULES.md'
      - 'ASSET_SAFE_100_PROCESS.md'
      - 'ASSET_SAFE_100_METHODS.md'
      - 'ASSET_ROUTE_PROOF_PROCESS.md'
      - 'ASSET_ROUTE_PROOF_METHODS.md'
      - 'PREBUILD_ASSET_GATE.md'
      - 'APPLICATION_SAFE_100_PROCESS.md'
      - 'APP_SAFE_R*.md'
      - 'TEST_ROUTING_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tahap7-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tahap7-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API30 inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-30' 'build-tools;34.0.0' 'system-images;android-30;google_apis;x86_64'

      - name: Set up exact Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Baseline Tahap 6 compatibility and Tahap 7 route gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          p=json.loads(Path('app/ASSURANCE_PLAN_R1_R9.json').read_text())
          assert p['stage']=='Tahap 7' and p['stageMap']=='G'
          assert p['parentBaseline']['name']=='Tahap 6'
          assert p['parentBaseline']['apkSha256']=='64f93a41bbf7623d5bfcc4a6a0bee69cc0ca613897f55c5fd004fcb7f335d878'
          assert re.search(r'\bversionCode\s+7\b',g)
          assert re.search(r'\bminSdk\s+30\b',g) and re.search(r'\btargetSdk\s+30\b',g)
          for item in [
            'app/src/main/java/com/toolbox/tools/integration/ExternalAdapterDescriptor.java',
            'app/src/main/java/com/toolbox/tools/integration/ExternalNormalizer.java',
            'app/src/main/java/com/toolbox/tools/integration/DeterministicExporter.java',
            'app/src/main/java/com/toolbox/tools/integration/SyncEngine.java',
            'app/src/main/java/com/toolbox/tools/integration/ExternalIntegrationManager.java',
            'app/src/test/java/com/toolbox/tools/integration/ExternalNormalizationTest.java',
            'app/src/test/java/com/toolbox/tools/integration/ExportSyncTest.java'
          ]: assert Path(item).is_file(),item
          print('BASELINE_TAHAP_6_COMPATIBILITY = PASS')
          print('TAHAP_7_G1_G4_ROUTE = PASS')
          PY

      - name: Automatic R1-R8 prebuild assurance
        run: python3 app/scripts/assurance_prebuild.py

      - name: Automatic ASSET_SAFE regression prebuild
        run: python3 app/scripts/asset_validate.py

      - name: Run Tahap 7 unit and failure tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Automatic R9 mutation challenge
        run: python3 app/scripts/mutation_test.py

      - name: Restore clean full test evidence
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: Assemble Tahap 7 packages
        run: |
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:assembleDebug

      - name: Verify Tahap 7 package metadata and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"; test -s "$DEBUG"
          B="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.toolbox.tools'" <<< "$B"
          grep -F "versionCode='7'" <<< "$B"
          grep -F "sdkVersion:'30'" <<< "$B"
          grep -F "targetSdkVersion:'30'" <<< "$B"
          sha256sum "$APK" | tee "$APK.sha256"
          echo 'TAHAP_7_PUBLIC_UNSIGNED_APK = PASS'

      - name: Boot API30 emulator and interact with external integration
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tahap7-avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | avdmanager create avd --force --name tahap7-api30 --package 'system-images;android-30;google_apis;x86_64' --path "$ANDROID_AVD_HOME/tahap7-api30.avd" --device 'pixel_2'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd tahap7-api30 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device
          for _ in $(seq 1 90); do
            [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && break
            sleep 2
          done
          API_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ABI="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$API_LEVEL" = 30; test "$ABI" = x86_64
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          START="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
          grep -F 'Status: ok' <<< "$START"
          sleep 2

          dump_ui(){ adb shell uiautomator dump /sdcard/w.xml >/dev/null; adb pull /sdcard/w.xml "$RUNNER_TEMP/w.xml" >/dev/null; }
          tap_text(){
            local target="$1"; dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/w.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot();target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds'])
                  if m:
                      l,t,r,b=map(int,m.groups());print((l+r)//2,(t+b)//2);raise SystemExit
          raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"; sleep 1
          }

          dump_ui
          grep -F 'ToolBox Tahap 7' "$RUNNER_TEMP/w.xml"
          grep -F 'Adapter • Normalisasi • Export • Sync' "$RUNNER_TEMP/w.xml"
          grep -F 'Eksternal: Sumber Demo • siap' "$RUNNER_TEMP/w.xml"
          grep -F 'Logic' "$RUNNER_TEMP/w.xml"
          grep -F 'Data' "$RUNNER_TEMP/w.xml"
          grep -F 'Binding' "$RUNNER_TEMP/w.xml"
          grep -F 'Asset' "$RUNNER_TEMP/w.xml"

          tap_text 'Import Demo'
          dump_ui
          grep -F 'Import: PASS • 1 record' "$RUNNER_TEMP/w.xml"

          tap_text 'Export'
          dump_ui
          grep -F 'Export: PASS • SHA256' "$RUNNER_TEMP/w.xml"

          tap_text 'Sync'
          dump_ui
          grep -F 'Sync: CLEAN • cursor.ui.sync.2' "$RUNNER_TEMP/w.xml"

          adb exec-out screencap -p > app/build/assurance/tahap7-api30.png
          {
            echo "API_LEVEL=$API_LEVEL"
            echo "EMULATOR_ABI=$ABI"
            echo "API30_APP_LAUNCH=PASS"
            echo "TAHAP7_UI_TEXT=PASS"
            echo "EXTERNAL_IMPORT=PASS"
            echo "EXTERNAL_EXPORT=PASS"
            echo "EXTERNAL_SYNC=PASS"
            echo "TAHAP6_AUTHORING_REGRESSION=PASS"
            echo "APP_THEME_RUNTIME=PASS"
          } > app/build/assurance/tahap7-api30-runtime.txt

      - name: Finalize ASSET_SAFE package/runtime proof
        run: python3 app/scripts/asset_finalize.py

      - name: Automatic R9 completeness and provenance closure
        run: python3 app/scripts/assurance_finalize.py

      - name: Upload Tahap 7 unsigned package and assurance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: toolbox-tahap7-public-unsigned-ready-private-signing
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/assurance/tahap7-r1-r8-prebuild-evidence.json
            app/build/assurance/tahap7-asset-prebuild-evidence.json
            app/build/assurance/tahap7-asset-final-evidence.json
            app/build/assurance/tahap7-mutation-evidence.json
            app/build/assurance/tahap7-r1-r9-evidence.json
            app/build/assurance/tahap7-api30-runtime.txt
            app/build/assurance/tahap7-api30.png
          if-no-files-found: error
          retention-days: 7
