name: ToolBox Public Tahap 10 Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/public-app-package.yml'
      - 'AGENTS.md'
      - 'TASK.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'ASSET_SAFE_100_RULES.md'
      - 'ASSET_SAFE_100_PROCESS.md'
      - 'ASSET_SAFE_100_METHODS.md'
      - 'ASSET_ROUTE_PROOF_PROCESS.md'
      - 'ASSET_ROUTE_PROOF_METHODS.md'
      - 'PREBUILD_ASSET_GATE.md'
      - 'APPLICATION_SAFE_100_PROCESS.md'
      - 'APP_SAFE_R*.md'
      - 'TEST_ROUTING_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tahap10-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tahap10-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API30 inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-30' 'build-tools;34.0.0' 'system-images;android-30;google_apis;x86_64'

      - name: Set up exact Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Permanent Baseline Tahap 7 and Tahap 9 predecessor route gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          p=json.loads(Path('app/ASSURANCE_PLAN_R1_R9.json').read_text())
          assert p['stage']=='Tahap 10' and p['stageMap']=='J'
          assert p['parentBaseline']['name']=='Tahap 7'
          assert p['parentBaseline']['apkSha256']=='741ebcf799280fbba1b4c7d2e60ba157ba133e3f6545b3468882373150f024f7'
          assert p['parentBaseline']['permanent'] is True
          assert p['parentBaseline']['rollbackAnchor'] is True
          assert p['developmentParentCandidate']['name']=='Tahap 9'
          assert p['developmentParentCandidate']['signedApkSha256']=='8f6f504c8f289926ad88550ab2686b801efc3ac12536c9e57f807b208461a116'
          assert p['developmentParentCandidate']['baseline'] is False
          assert re.search(r'\bversionCode\s+10\b',g)
          assert "versionName '10.0-tahap10-dev'" in g
          assert re.search(r'\bminSdk\s+30\b',g)
          assert re.search(r'\btargetSdk\s+30\b',g)
          for item in [
            'app/src/main/java/com/toolbox/tools/build/BuildValidator.java',
            'app/src/main/java/com/toolbox/tools/build/ReadyCoordinator.java',
            'app/src/main/java/com/toolbox/tools/build/ApplicationIr.java',
            'app/src/main/java/com/toolbox/tools/build/ApplicationIrBuilder.java',
            'app/src/main/java/com/toolbox/tools/build/CandidateIdentity.java',
            'app/src/main/java/com/toolbox/tools/build/CandidateIdentityFactory.java',
            'app/src/test/java/com/toolbox/tools/build/ReadyCoordinatorTest.java',
            'app/src/test/java/com/toolbox/tools/build/ApplicationIrTest.java',
            'app/src/test/java/com/toolbox/tools/build/CandidateIdentityTest.java',
            'app/scripts/candidate_manifest.py'
          ]:
              assert Path(item).is_file(),item
          print('ROLLBACK_BASELINE_TAHAP_7 = PASS')
          print('DEVELOPMENT_PARENT_TAHAP_9_SIGNED_IDENTITY = PASS')
          print('TAHAP_10_J1_J4_ROUTE = PASS')
          print('FIREBASE_USED = NO')
          PY

      - name: Automatic R1-R8 prebuild assurance
        run: python3 app/scripts/assurance_prebuild.py

      - name: Automatic ASSET_SAFE regression prebuild
        run: python3 app/scripts/asset_validate.py

      - name: Run Tahap 10 unit and failure tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Automatic R9 mutation challenge
        run: python3 app/scripts/mutation_test.py

      - name: Restore clean full test evidence
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: Assemble Tahap 10 packages
        run: |
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:assembleDebug

      - name: Verify Tahap 10 package metadata and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s "$DEBUG"
          B="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.toolbox.tools'" <<< "$B"
          grep -F "versionCode='10'" <<< "$B"
          grep -F "versionName='10.0-tahap10-dev'" <<< "$B"
          grep -F "sdkVersion:'30'" <<< "$B"
          grep -F "targetSdkVersion:'30'" <<< "$B"
          sha256sum "$APK" | tee "$APK.sha256"
          echo 'TAHAP_10_PUBLIC_UNSIGNED_APK = PASS'

      - name: Boot API30 emulator and interact with READY IR candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tahap10-avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | avdmanager create avd --force --name tahap10-api30 --package 'system-images;android-30;google_apis;x86_64' --path "$ANDROID_AVD_HOME/tahap10-api30.avd" --device 'pixel_2'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd tahap10-api30 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device
          booted=0
          for _ in $(seq 1 90); do
            [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && { booted=1; break; }
            kill -0 "$PID" 2>/dev/null || {
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2 || true
              exit 1
            }
            sleep 2
          done
          test "$booted" = 1

          API_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ABI="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$API_LEVEL" = 30
          test "$ABI" = x86_64

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          START="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
          grep -F 'Status: ok' <<< "$START"
          sleep 2

          dump_ui(){
            adb shell uiautomator dump /sdcard/w.xml >/dev/null
            adb pull /sdcard/w.xml "$RUNNER_TEMP/w.xml" >/dev/null
          }

          tap_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/w.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds'])
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          dump_ui
          grep -F 'ToolBox Tahap 10' "$RUNNER_TEMP/w.xml"
          grep -F 'READY • Validator • IR • Candidate Identity' "$RUNNER_TEMP/w.xml"
          grep -F 'Build: READY belum dipublish' "$RUNNER_TEMP/w.xml"
          grep -F 'Capability Scan' "$RUNNER_TEMP/w.xml"
          grep -F 'Repair Demo' "$RUNNER_TEMP/w.xml"

          tap_text 'READY'
          dump_ui
          grep -F 'READY: PASS • revision ' "$RUNNER_TEMP/w.xml"

          tap_text 'Buat IR'
          dump_ui
          IR_SHA="$(python3 - "$RUNNER_TEMP/w.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          for n in root.iter('node'):
              text=n.attrib.get('text','')
              m=re.fullmatch(r'IR: PASS • ([0-9a-f]{64})',text)
              if m:
                  print(m.group(1))
                  raise SystemExit
          raise SystemExit('IR_SHA256_NOT_FOUND')
          PY
          )"
          [[ "$IR_SHA" =~ ^[0-9a-f]{64}$ ]]

          tap_text 'Candidate Preview'
          dump_ui
          grep -F 'Candidate Preview: ' "$RUNNER_TEMP/w.xml"

          adb exec-out screencap -p > app/build/assurance/tahap10-api30.png
          {
            echo "API_LEVEL=$API_LEVEL"
            echo "EMULATOR_ABI=$ABI"
            echo "API30_APP_LAUNCH=PASS"
            echo "TAHAP10_UI_TEXT=PASS"
            echo "READY_GATE=PASS"
            echo "IR_BUILD=PASS"
            echo "IR_SHA256=$IR_SHA"
            echo "CANDIDATE_PREVIEW=PASS"
            echo "TAHAP9_REGRESSION=PASS"
            echo "FIREBASE_USED=NO"
            echo "APP_THEME_RUNTIME=PASS"
          } > app/build/assurance/tahap10-api30-runtime.txt

      - name: Generate exact Tahap 10 candidate identity
        run: python3 app/scripts/candidate_manifest.py

      - name: Finalize ASSET_SAFE package/runtime proof
        run: python3 app/scripts/asset_finalize.py

      - name: Automatic R9 completeness and provenance closure
        run: python3 app/scripts/assurance_finalize.py

      - name: Upload Tahap 10 unsigned package and assurance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: toolbox-tahap10-public-unsigned-ready-private-signing
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/assurance/tahap10-r1-r8-prebuild-evidence.json
            app/build/assurance/tahap10-asset-prebuild-evidence.json
            app/build/assurance/tahap10-asset-final-evidence.json
            app/build/assurance/tahap10-mutation-evidence.json
            app/build/assurance/tahap10-r1-r9-evidence.json
            app/build/assurance/tahap10-candidate-manifest.json
            app/build/assurance/tahap10-api30-runtime.txt
            app/build/assurance/tahap10-api30.png
          if-no-files-found: error
          retention-days: 7
