name: ToolBox Public Tahap 11 Package

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/public-app-package.yml'
      - 'AGENTS.md'
      - 'TASK.md'
      - 'R1_R9_ASSET_CHAIN.md'
      - 'ASSET_SAFE_100_RULES.md'
      - 'ASSET_SAFE_100_PROCESS.md'
      - 'ASSET_SAFE_100_METHODS.md'
      - 'ASSET_ROUTE_PROOF_PROCESS.md'
      - 'ASSET_ROUTE_PROOF_METHODS.md'
      - 'PREBUILD_ASSET_GATE.md'
      - 'APPLICATION_SAFE_100_PROCESS.md'
      - 'APP_SAFE_R*.md'
      - 'TEST_ROUTING_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tahap11-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tahap11-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API30 inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-30' 'build-tools;34.0.0' 'system-images;android-30;google_apis;x86_64'

      - name: Set up exact Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Tahap 11 route gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          g=Path('app/build.gradle').read_text()
          p=json.loads(Path('app/ASSURANCE_PLAN_R1_R9.json').read_text())
          assert p['stage']=='Tahap 11' and p['stageMap']=='K'
          assert p['parentBaseline']['name']=='Tahap 7'
          assert p['parentBaseline']['apkSha256']=='741ebcf799280fbba1b4c7d2e60ba157ba133e3f6545b3468882373150f024f7'
          assert p['parentBaseline']['permanent'] is True
          assert p['parentBaseline']['rollbackAnchor'] is True
          assert p['developmentParentCandidate']['name']=='Tahap 10'
          assert p['developmentParentCandidate']['signedApkSha256']=='fbc39153bc121ed2d32bc9c24e9ff8f0e9b7730fcef01021f4adfd830fbd21ff'
          assert p['developmentParentCandidate']['baseline'] is False
          assert re.search(r'\bversionCode\s+11\b',g)
          assert "versionName '11.0-tahap11-dev'" in g
          assert re.search(r'\bminSdk\s+30\b',g)
          assert re.search(r'\btargetSdk\s+30\b',g)
          for item in [
            'app/src/main/java/com/toolbox/tools/delivery/PatchManifest.java',
            'app/src/main/java/com/toolbox/tools/delivery/PatchPayload.java',
            'app/src/main/java/com/toolbox/tools/delivery/RemoteVerificationProof.java',
            'app/src/main/java/com/toolbox/tools/delivery/RemotePatchVerifier.java',
            'app/src/main/java/com/toolbox/tools/delivery/RemoteTrustAnchor.java',
            'app/src/main/java/com/toolbox/tools/delivery/SafePatchManager.java',
            'app/src/test/java/com/toolbox/tools/delivery/RemotePatchVerifierTest.java',
            'app/src/test/java/com/toolbox/tools/delivery/SafePatchManagerTest.java',
            'app/scripts/tahap11_assurance_prebuild.py',
            'app/scripts/tahap11_mutation_test.py',
            'app/scripts/tahap11_asset_validate.py',
            'app/scripts/tahap11_asset_finalize.py',
            'app/scripts/tahap11_candidate_manifest.py',
            'app/scripts/tahap11_patch_request.py',
            'app/scripts/tahap11_assurance_finalize.py'
          ]:
              assert Path(item).is_file(),item
          print('ROLLBACK_BASELINE_TAHAP_7 = PASS')
          print('DEVELOPMENT_PARENT_TAHAP_10_SIGNED_IDENTITY = PASS')
          print('TAHAP_11_K_ROUTE = PASS')
          print('FIREBASE_USED = NO')
          PY

      - name: Automatic R1-R8 prebuild assurance
        run: python3 app/scripts/tahap11_assurance_prebuild.py

      - name: Automatic ASSET_SAFE prebuild
        run: python3 app/scripts/tahap11_asset_validate.py

      - name: Run Tahap 11 unit and failure tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Automatic R9 mutation challenge
        run: python3 app/scripts/tahap11_mutation_test.py

      - name: Restore clean full test evidence
        run: gradle --no-daemon :app:testDebugUnitTest --rerun-tasks

      - name: Assemble Tahap 11 packages
        run: |
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:assembleDebug

      - name: Verify Tahap 11 package metadata and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s "$DEBUG"
          B="$("$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.toolbox.tools'" <<< "$B"
          grep -F "versionCode='11'" <<< "$B"
          grep -F "versionName='11.0-tahap11-dev'" <<< "$B"
          grep -F "sdkVersion:'30'" <<< "$B"
          grep -F "targetSdkVersion:'30'" <<< "$B"
          sha256sum "$APK" | tee "$APK.sha256"
          echo 'TAHAP_11_PUBLIC_UNSIGNED_APK = PASS'

      - name: Boot API30 emulator and interact with Tahap 11
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tahap11-avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | avdmanager create avd --force --name tahap11-api30 --package 'system-images;android-30;google_apis;x86_64' --path "$ANDROID_AVD_HOME/tahap11-api30.avd" --device 'pixel_2'
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd tahap11-api30 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device
          booted=0
          for _ in $(seq 1 90); do
            [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]] && { booted=1; break; }
            kill -0 "$PID" 2>/dev/null || {
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2 || true
              exit 1
            }
            sleep 2
          done
          test "$booted" = 1

          API_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ABI="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$API_LEVEL" = 30
          test "$ABI" = x86_64

          adb install -r app/build/outputs/apk/debug/app-debug.apk
          START="$(adb shell am start -W -n com.toolbox.tools/.MainActivity)"
          grep -F 'Status: ok' <<< "$START"
          sleep 2

          dump_ui(){
            adb shell uiautomator dump /sdcard/w.xml >/dev/null
            adb pull /sdcard/w.xml "$RUNNER_TEMP/w.xml" >/dev/null
          }

          tap_text(){
            local target="$1"
            dump_ui
            read X Y < <(python3 - "$RUNNER_TEMP/w.xml" "$target" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text')==target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds'])
                  if m:
                      l,t,r,b=map(int,m.groups())
                      print((l+r)//2,(t+b)//2)
                      raise SystemExit
          raise SystemExit('UI_TEXT_NOT_FOUND='+target)
          PY
            )
            adb shell input tap "$X" "$Y"
            sleep 1
          }

          dump_ui
          grep -F 'ToolBox Tahap 11' "$RUNNER_TEMP/w.xml"
          grep -F 'App.apk • App.patch • Remote Verify • Safe Restore' "$RUNNER_TEMP/w.xml"
          grep -F 'READY • Validator • IR • Candidate Identity' "$RUNNER_TEMP/w.xml"
          grep -F 'Patch: remote verification wajib' "$RUNNER_TEMP/w.xml"
          grep -F 'Capability Scan' "$RUNNER_TEMP/w.xml"
          grep -F 'Repair Demo' "$RUNNER_TEMP/w.xml"

          tap_text 'READY'
          dump_ui
          grep -F 'READY: PASS • revision ' "$RUNNER_TEMP/w.xml"

          tap_text 'Buat IR'
          dump_ui
          IR_SHA="$(python3 - "$RUNNER_TEMP/w.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          for n in root.iter('node'):
              text=n.attrib.get('text','')
              m=re.fullmatch(r'IR: PASS • ([0-9a-f]{64})',text)
              if m:
                  print(m.group(1))
                  raise SystemExit
          raise SystemExit('IR_SHA256_NOT_FOUND')
          PY
          )"
          [[ "$IR_SHA" =~ ^[0-9a-f]{64}$ ]]

          tap_text 'Candidate Preview'
          dump_ui
          grep -F 'Candidate Preview: ' "$RUNNER_TEMP/w.xml"

          tap_text 'Patch Preview'
          dump_ui
          grep -F 'Patch Preview: PASS' "$RUNNER_TEMP/w.xml"

          tap_text 'Safe Restore'
          dump_ui
          grep -F 'Safe Restore: PASS • recovery point' "$RUNNER_TEMP/w.xml"

          adb exec-out screencap -p > app/build/assurance/tahap11-api30.png
          {
            echo "API_LEVEL=$API_LEVEL"
            echo "EMULATOR_ABI=$ABI"
            echo "API30_APP_LAUNCH=PASS"
            echo "TAHAP11_UI_TEXT=PASS"
            echo "READY_GATE=PASS"
            echo "IR_BUILD=PASS"
            echo "IR_SHA256=$IR_SHA"
            echo "CANDIDATE_PREVIEW=PASS"
            echo "PATCH_PREVIEW=PASS"
            echo "SAFE_RESTORE=PASS"
            echo "TAHAP10_REGRESSION=PASS"
            echo "FIREBASE_USED=NO"
            echo "APP_THEME_RUNTIME=PASS"
          } > app/build/assurance/tahap11-api30-runtime.txt

      - name: Generate exact Tahap 11 candidate identity
        run: python3 app/scripts/tahap11_candidate_manifest.py

      - name: Generate Tahap 11 App.patch request
        run: python3 app/scripts/tahap11_patch_request.py

      - name: Finalize ASSET_SAFE package/runtime proof
        run: python3 app/scripts/tahap11_asset_finalize.py

      - name: Automatic R9 completeness and provenance closure
        run: python3 app/scripts/tahap11_assurance_finalize.py

      - name: Upload Tahap 11 public package and assurance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: toolbox-tahap11-public-ready-private-signing
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/assurance/tahap11-r1-r8-prebuild-evidence.json
            app/build/assurance/tahap11-asset-prebuild-evidence.json
            app/build/assurance/tahap11-asset-final-evidence.json
            app/build/assurance/tahap11-mutation-evidence.json
            app/build/assurance/tahap11-r1-r9-evidence.json
            app/build/assurance/tahap11-candidate-manifest.json
            app/build/assurance/tahap11-patch-request.json
            app/build/assurance/tahap11-api30-runtime.txt
            app/build/assurance/tahap11-api30.png
          if-no-files-found: error
          retention-days: 7
