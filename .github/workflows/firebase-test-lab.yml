name: ToolBox Firebase Test Lab ARM64

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Connection check, frozen candidate preflight, or ONE user-authorized final APK test
        required: true
        default: connection-only
        type: choice
        options:
          - connection-only
          - candidate-preflight
          - test-existing-artifact
      final_gate_authorization:
        description: test-existing-artifact only; approved-once requires explicit user approval for this attempt
        required: true
        default: locked
        type: choice
        options:
          - locked
          - approved-once
      approval_reference:
        description: Required for final test; reference to explicit user approval for THIS attempt
        required: false
        type: string
      source_repository:
        description: Private repository that produced the approved APK
        required: true
        default: RMTampu/ToolBox
        type: string
      source_run_id:
        description: Private caller workflow run ID that produced the APK artifact
        required: false
        type: string
      expected_source_git_sha:
        description: Exact frozen private source commit SHA
        required: false
        type: string
      expected_apk_sha256:
        description: Exact frozen APK SHA-256
        required: false
        type: string
      artifact_name:
        description: Artifact containing exactly one approved APK
        required: false
        default: toolbox-apk
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-test-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  ANDROID_VERSION_ID: '30'
  REQUIRED_ABI: arm64-v8a

jobs:
  firebase-test-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout public CI bridge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Validate bridge and single-use authorization
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.TOOLBOX_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          test "$missing" -eq 0

          mode='${{ inputs.mode }}'
          authorization='${{ inputs.final_gate_authorization }}'
          source_repo='${{ inputs.source_repository }}'
          source_run_id='${{ inputs.source_run_id }}'
          source_sha='${{ inputs.expected_source_git_sha }}'
          apk_sha='${{ inputs.expected_apk_sha256 }}'

          if [[ "$mode" == 'connection-only' ]]; then
            test "$authorization" = 'locked'
          else
            test -n "${SOURCE_TOKEN:-}" || { echo '::error::TOOLBOX_SOURCE_TOKEN is required to read the private source run/artifact.'; exit 1; }
            [[ "$source_repo" == 'RMTampu/ToolBox' ]] || { echo '::error::source_repository must be RMTampu/ToolBox for ToolBox final gate.'; exit 1; }
            [[ "$source_run_id" =~ ^[0-9]+$ ]] || { echo '::error::source_run_id is required.'; exit 1; }
            [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::expected_source_git_sha must be 40 hex.'; exit 1; }
            [[ "$apk_sha" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::expected_apk_sha256 must be 64 hex.'; exit 1; }
          fi

          if [[ "$mode" == 'candidate-preflight' ]]; then
            test "$authorization" = 'locked' || { echo '::error::Preflight must keep Firebase authorization LOCKED.'; exit 1; }
          fi

          if [[ "$mode" == 'test-existing-artifact' ]]; then
            test "$authorization" = 'approved-once' || { echo '::error::Firebase Final Gate is LOCKED; explicit user approval is required.'; exit 1; }
            test -n '${{ inputs.approval_reference }}' || { echo '::error::approval_reference is required.'; exit 1; }
          fi

      - name: Validate exact private source workflow run
        if: ${{ inputs.mode != 'connection-only' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOOLBOX_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo='${{ inputs.source_repository }}'
          run_id='${{ inputs.source_run_id }}'
          expected='${{ inputs.expected_source_git_sha }}'.lower()
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'toolbox-private-source-binding'
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          run=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
          main=get(f'https://api.github.com/repos/{repo}/branches/main')
          current=str(main.get('commit',{}).get('sha','')).lower()
          checks={
              'current_main_head':current==expected,
              'head_sha':str(run.get('head_sha','')).lower()==expected,
              'status':run.get('status')=='completed',
              'conclusion':run.get('conclusion')=='success',
              'workflow_name':run.get('name')=='ToolBox APK Candidate Gate',
              'workflow_path':run.get('path')=='.github/workflows/apk-candidate.yml',
              'head_branch':run.get('head_branch')=='main'
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit(f'PRIVATE_SOURCE_RUN_BINDING failed={failed} run={run_id} current={current} expected={expected}')
          print(f'PRIVATE_SOURCE_RUN_BINDING = PASS repo={repo} run={run_id} sha={expected}')
          PY

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '582.0.0'
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify authenticated project
        shell: bash
        run: |
          set -euo pipefail
          gcloud --quiet config set project "$GCP_PROJECT_ID"
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'

      - name: Resolve live Android 11 ARM64 Test Lab model
        id: device
        shell: bash
        run: |
          set -euo pipefail
          catalog="$RUNNER_TEMP/testlab-virtual-models.json"
          gcloud firebase test android models list --project="$GCP_PROJECT_ID" --filter=virtual --format=json > "$catalog"
          model_id="$(jq -r --arg version "$ANDROID_VERSION_ID" --arg abi "$REQUIRED_ABI" '.[] | select((.id // "") | endswith(".arm")) | select((.supportedVersionIds // []) | index($version)) | select(any(.supportedAbis[]?; . == $abi or endswith(":" + $abi))) | .id' "$catalog" | head -n1)"
          if [[ -z "$model_id" || "$model_id" == 'null' ]]; then
            echo '::error::No live Firebase Test Lab model proves Android API30 + arm64-v8a. No fallback allowed.'
            exit 1
          fi
          gcloud firebase test android models describe "$model_id" --project="$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/selected-testlab-model.json"
          echo "model_id=$model_id" >> "$GITHUB_OUTPUT"
          echo "Selected model: $model_id / API $ANDROID_VERSION_ID / $REQUIRED_ABI"

      - name: Download APK artifact from private caller run
        if: ${{ inputs.mode != 'connection-only' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_name }}
          path: firebase-input
          github-token: ${{ secrets.TOOLBOX_SOURCE_TOKEN }}
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate frozen APK identity
        if: ${{ inputs.mode != 'connection-only' }}
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find firebase-input -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -eq 1 || { echo "::error::Expected exactly one APK; found ${#apks[@]}"; exit 1; }
          apk="${apks[0]}"
          digest="$(sha256sum "$apk" | awk '{print tolower($1)}')"
          expected="$(printf '%s' '${{ inputs.expected_apk_sha256 }}' | tr 'A-F' 'a-f')"
          test "$digest" = "$expected" || { echo "::error::APK SHA-256 mismatch."; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo 'FROZEN_APK_BINDING = PASS'

      - name: Record preflight summary
        if: ${{ inputs.mode == 'candidate-preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Candidate preflight PASS. Firebase execution remains LOCKED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Firebase test execution occurred.' >> "$GITHUB_STEP_SUMMARY"

      - name: Consume single-use Final Gate authorization
        if: ${{ inputs.mode == 'test-existing-artifact' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/firebase-authorization-consumed.txt" <<EOF
          state=CONSUMED
          policy=1-explicit-user-approval-equals-1-firebase-execution-attempt
          github_run_id=${GITHUB_RUN_ID}
          source_repository=${{ inputs.source_repository }}
          source_run_id=${{ inputs.source_run_id }}
          expected_source_git_sha=${{ inputs.expected_source_git_sha }}
          artifact_name=${{ inputs.artifact_name }}
          apk_sha256=${{ steps.apk.outputs.sha256 }}
          approval_reference=${{ inputs.approval_reference }}
          target_android_api=${ANDROID_VERSION_ID}
          target_abi=${REQUIRED_ABI}
          EOF
          echo 'Single-use Firebase authorization CONSUMED for this attempt.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run ONE Robo smoke test on Android 11 ARM64
        if: ${{ inputs.mode == 'test-existing-artifact' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/firebase-authorization-consumed.txt"
          log="$RUNNER_TEMP/firebase-test-lab.log"
          set +e
          gcloud firebase test android run \
            --project="$GCP_PROJECT_ID" \
            --type=robo \
            --app='${{ steps.apk.outputs.path }}' \
            --device="model=${{ steps.device.outputs.model_id }},version=$ANDROID_VERSION_ID,locale=en,orientation=portrait" \
            --timeout=5m \
            --client-details="matrixLabel=ToolBox API30 ARM64 ${GITHUB_RUN_ID}" \
            2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Firebase returned $status. Authorization is consumed; DO NOT auto-retry."
            exit "$status"
          fi
          echo 'Firebase Test Lab: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Authorization is LOCKED again; another run needs new explicit approval.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firebase bridge evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: firebase-test-lab-bridge-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/selected-testlab-model.json
            ${{ runner.temp }}/firebase-authorization-consumed.txt
            ${{ runner.temp }}/firebase-test-lab.log
          if-no-files-found: ignore
          retention-days: 14
