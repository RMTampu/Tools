name: ToolBox Dependency Trust Bootstrap

on:
  workflow_call:

permissions:
  contents: write

jobs:
  dependency-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout caller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Record source provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_REPOSITORY=$GITHUB_REPOSITORY"
          echo "SOURCE_COMMIT_SHA=$GITHUB_SHA"
          echo "SOURCE_REF=$GITHUB_REF"
          echo "CI_REPOSITORY=RMTampu/Tools"

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Setup Gradle 8.7 without shared cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Setup Android command line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install declared Android inputs
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-30' 'platforms;android-35' 'build-tools;34.0.0'
          test -s "$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
          test -s "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"

      - name: Resolve pinned dependency trust material
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          set -euo pipefail
          gradle --no-daemon --refresh-dependencies --write-locks --write-verification-metadata sha256 \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" \
            :toolbox-kernel:dependencies \
            :toolbox-app:dependencies \
            :toolbox-app:lintAnalyzeDebug \
            :toolbox-app:lintAnalyzeRelease
          test -s toolbox-kernel/gradle.lockfile
          test -s toolbox-app/gradle.lockfile
          test -s gradle/verification-metadata.xml
          grep -q '<sha256' gradle/verification-metadata.xml

      - name: Record dependency candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def digest(path):
              h=hashlib.sha256()
              with Path(path).open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024), b''):
                      h.update(block)
              return h.hexdigest()
          payload={
              'schemaVersion':4,
              'status':'CANDIDATE_UNREVIEWED',
              'sourceRepository':os.environ['GITHUB_REPOSITORY'],
              'generatedFromGitSha':os.environ['GITHUB_SHA'],
              'workflowRunId':os.environ['GITHUB_RUN_ID'],
              'ciRepository':'RMTampu/Tools',
              'outputsSha256':{
                  'toolbox-kernel/gradle.lockfile':digest('toolbox-kernel/gradle.lockfile'),
                  'toolbox-app/gradle.lockfile':digest('toolbox-app/gradle.lockfile'),
                  'gradle/verification-metadata.xml':digest('gradle/verification-metadata.xml')
              }
          }
          Path('verification/dependency_trust_candidate.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit dependency candidate to caller repository
        shell: bash
        run: |
          set -euo pipefail
          git add toolbox-kernel/gradle.lockfile toolbox-app/gradle.lockfile gradle/verification-metadata.xml verification/dependency_trust_candidate.json
          if git diff --cached --quiet; then
            echo 'Dependency trust state unchanged.'
            exit 0
          fi
          git config user.name 'toolbox-dependency-bootstrap[bot]'
          git config user.email 'toolbox-dependency-bootstrap[bot]@users.noreply.github.com'
          git commit -m 'Update dependency trust candidate'
          git push origin HEAD:${GITHUB_REF_NAME}
