name: ToolBox Dependency Trust Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'toolbox-kernel/build.gradle.kts'
      - 'toolbox-app/build.gradle.kts'
      - '.github/workflows/dependency-bootstrap.yml'

permissions:
  contents: read

jobs:
  resolve-trusted-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install compile SDK
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'

      - name: Resolve and record exact dependency state
        shell: bash
        run: >-
          gradle --no-daemon
          --write-locks
          --write-verification-metadata sha256
          :toolbox-kernel:dependencies
          :toolbox-app:dependencies

      - name: Validate generated trust state
        shell: bash
        run: |
          test -s toolbox-kernel/gradle.lockfile
          test -s toolbox-app/gradle.lockfile
          test -s gradle/verification-metadata.xml
          grep -q '<sha256' gradle/verification-metadata.xml

      - name: Package dependency trust evidence
        shell: bash
        run: |
          mkdir -p verification/bootstrap
          cp toolbox-kernel/gradle.lockfile verification/bootstrap/toolbox-kernel.gradle.lockfile
          cp toolbox-app/gradle.lockfile verification/bootstrap/toolbox-app.gradle.lockfile
          cp gradle/verification-metadata.xml verification/bootstrap/verification-metadata.xml
          shasum -a 256 verification/bootstrap/* > verification/bootstrap/SHA256SUMS

      - name: Upload dependency trust evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-trust-state
          path: verification/bootstrap
          if-no-files-found: error
          retention-days: 14
