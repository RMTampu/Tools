name: ToolBox Release Signing Identity Bootstrap

on:
  workflow_call:
    secrets:
      SIGNING_KEY:
        required: true
      KEY_STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  prove-release-signing-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout caller source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup exact Temurin JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.20+1'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Verify signing identity and private-key usability
        id: cert
        shell: bash
        env:
          TOOLBOX_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
          TOOLBOX_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          TOOLBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOLBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TOOLBOX_KEYSTORE_BASE64"
          test -n "$TOOLBOX_KEYSTORE_PASSWORD"
          test -n "$TOOLBOX_KEY_ALIAS"
          test -n "$TOOLBOX_KEY_PASSWORD"
          umask 077
          KEYSTORE="$RUNNER_TEMP/toolbox-release.keystore"
          CERT_DER="$RUNNER_TEMP/toolbox-release-cert.der"
          PROBE_DIR="$RUNNER_TEMP/signing-probe"
          PROBE_JAR="$RUNNER_TEMP/signing-probe.jar"
          printf '%s' "$TOOLBOX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -storepass "$TOOLBOX_KEYSTORE_PASSWORD" -alias "$TOOLBOX_KEY_ALIAS" -file "$CERT_DER"
          CERT_SHA="$(sha256sum "$CERT_DER" | awk '{print tolower($1)}')"
          OPENSSL_SHA="$(openssl x509 -inform DER -in "$CERT_DER" -noout -fingerprint -sha256 | sed 's/^sha256 Fingerprint=//I;s/://g' | tr 'A-F' 'a-f')"
          test "$CERT_SHA" = "$OPENSSL_SHA"
          EXPECTED="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(str(json.loads(Path('verification/signing_contract.json').read_text())['release']['expectedCertificateSha256']).lower())
          PY
          )"
          test "$CERT_SHA" = "$EXPECTED"
          mkdir -p "$PROBE_DIR"
          printf 'ToolBox signing identity probe\n' > "$PROBE_DIR/payload.txt"
          jar --create --file "$PROBE_JAR" -C "$PROBE_DIR" payload.txt
          jarsigner -keystore "$KEYSTORE" -storepass "$TOOLBOX_KEYSTORE_PASSWORD" -keypass "$TOOLBOX_KEY_PASSWORD" "$PROBE_JAR" "$TOOLBOX_KEY_ALIAS" >/dev/null
          jarsigner -verify "$PROBE_JAR" | grep -F 'jar verified.'
          echo "fingerprint=$CERT_SHA" >> "$GITHUB_OUTPUT"
          rm -rf "$KEYSTORE" "$CERT_DER" "$PROBE_DIR" "$PROBE_JAR"

      - name: Write signing identity candidate
        shell: bash
        env:
          CERTIFICATE_SHA256: ${{ steps.cert.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          contract=Path('verification/signing_contract.json')
          digest=hashlib.sha256(contract.read_bytes()).hexdigest()
          payload={
              'schemaVersion':2,
              'status':'SIGNING_IDENTITY_CANDIDATE_UNREVIEWED',
              'sourceRepository':os.environ['GITHUB_REPOSITORY'],
              'generatedFromGitSha':os.environ['GITHUB_SHA'],
              'workflowRunId':os.environ['GITHUB_RUN_ID'],
              'ciRepository':'RMTampu/Tools',
              'signingContractSha256':digest,
              'certificateSha256':os.environ['CERTIFICATE_SHA256'].lower(),
              'privateKeySigningProbeVerified':True,
              'privateKeyPersisted':False
          }
          Path('verification/signing_identity_candidate.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit candidate to caller repository
        shell: bash
        run: |
          set -euo pipefail
          git add verification/signing_identity_candidate.json
          if git diff --cached --quiet; then
            echo 'Signing identity candidate unchanged.'
            exit 0
          fi
          git config user.name 'toolbox-signing-bootstrap[bot]'
          git config user.email 'toolbox-signing-bootstrap[bot]@users.noreply.github.com'
          git commit -m 'Record release signing identity candidate'
          git push origin HEAD:${GITHUB_REF_NAME}
